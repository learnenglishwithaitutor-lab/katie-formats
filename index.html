<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F0EEE9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Katie Formats" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Katie Formats</title>
  <!-- BUST-v48 -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F0EEE9; --surface: #FFFFFF;
      --border: rgba(0,0,0,0.08); --text: #1a1a1a; --muted: #888;
      --approve: #1D9E75; --approve-bg: rgba(29,158,117,0.1);
      --reject: #E24B4A; --reject-bg: rgba(226,75,74,0.1);
    }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      overflow: hidden; -webkit-tap-highlight-color: transparent;
    }
    .app {
      display: flex; flex-direction: column; height: 100dvh;
      padding: env(safe-area-inset-top,16px) 16px env(safe-area-inset-bottom,20px);
      max-width: 480px; margin: 0 auto;
    }

    /* Header */
    .header { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 0 10px; flex-shrink: 0; }
    .header-left h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
    .header-left .total-count { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
    
    .icon-btn { background: none; border: none; cursor: pointer; padding: 0; font-size: 14px; line-height: 1; color: var(--muted); }
    .icon-btn:active { opacity: 0.5; }
    .refresh-btn { background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; gap: 4px; color: var(--text); font-size: 13px; font-weight: 500; font-family: inherit; }
    .refresh-btn:active { opacity: 0.5; }
    .refresh-icon { font-size: 16px; line-height: 1; display: inline-block; }
    @keyframes spin-icon { to { transform: rotate(360deg); } }
    .refresh-icon.spinning { animation: spin-icon 0.8s linear infinite; }
    .last-pulled { font-size: 10px; color: var(--muted); }

    /* Progress */
    .progress-bar { height: 2px; background: rgba(0,0,0,0.06); border-radius: 2px; margin-bottom: 12px; flex-shrink: 0; }
    .progress-fill { height: 100%; background: var(--approve); border-radius: 2px; transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }

    /* Card area */
    .card-area { flex: 1; position: relative; min-height: 0; }
    .card-stack { position: absolute; top: 0; bottom: 0; left: 10px; right: 10px; }
    .card {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: 20px; overflow: hidden; display: flex; flex-direction: column;
      touch-action: none; will-change: transform; z-index: 2;
      box-shadow: 8px 8px 0 0 #ddd8ce, 14px 14px 0 0 #d0cbc0;
    }
    .card.animating { transition: transform 0.38s cubic-bezier(0.4,0,0.2,1), opacity 0.38s ease; }
    .card.fly-right { transform: translateX(110%) rotate(12deg) !important; opacity: 0; }
    .card.fly-left  { transform: translateX(-110%) rotate(-12deg) !important; opacity: 0; }
    .deck-card { position: absolute; background: var(--surface); border: 0.5px solid var(--border); border-radius: 20px; pointer-events: none; }
    .deck-card-2 { top: 10px; left: 8px; right: 8px; bottom: 0; opacity: 0.55; z-index: 1; }
    .deck-card-3 { top: 0; left: 16px; right: 16px; bottom: 0; opacity: 0.3; z-index: 0; }

    /* Video frame */
    .video-frame { flex: 1; min-height: 0; background: #ebebeb; position: relative; }
    .video-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-size: 13px; }
    .video-loading .spinner { width: 24px; height: 24px; border: 2px solid rgba(0,0,0,0.08); border-top-color: var(--approve); border-radius: 50%; animation: spin-icon 0.8s linear infinite; }
    .watch-link { color: #5DCAA5; font-size: 12px; text-decoration: none; padding: 6px 14px; border: 0.5px solid #5DCAA5; border-radius: 999px; margin-top: 6px; }

    /* Meta */
    .meta { padding: 12px 14px 16px; flex-shrink: 0; border-top: 0.5px solid var(--border); background: var(--surface); }
    .meta-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
    .meta-top-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .badge { font-size: 10px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: rgba(29,158,117,0.12); color: #1D9E75; white-space: nowrap; flex-shrink: 0; }
    .posted-date { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .comments-link { font-size: 12px; color: #5DCAA5; text-decoration: none; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
    .card-title { font-size: 13px; font-weight: 500; line-height: 1.5; color: var(--text); word-break: break-word; }
    .views { font-size: 11px; color: var(--muted); margin-top: 6px; }
    .screen-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
    .screen-topic { font-size: 11px; font-weight: 600; color: var(--text); }
    .screen-chip { font-size: 10px; color: var(--muted); border: 0.5px solid var(--muted); border-radius: 999px; padding: 2px 8px; }
    .screen-chip.listicle { color: #5DCAA5; border-color: #5DCAA5; }

    /* Why-skip sheet */
    .why-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 90; }
    .why-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 91; background: var(--surface);
      border-top-left-radius: 18px; border-top-right-radius: 18px; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
      box-shadow: 0 -8px 30px rgba(0,0,0,0.35); max-height: 85vh; overflow-y: auto; }
    .why-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
    .why-sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
    .why-opt { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px;
      border-radius: 12px; border: 0.5px solid var(--border); background: var(--bg); color: var(--text);
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .why-opt.sel { border-color: var(--approve); box-shadow: inset 0 0 0 1px var(--approve); }
    .why-opt small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); margin-top: 3px; }
    .why-input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 0.5px solid var(--border);
      background: var(--bg); color: var(--text); font-family: inherit; font-size: 13px; margin-top: 4px; }
    .why-recent { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .why-recent button { font-size: 11px; color: var(--muted); background: none; border: 0.5px solid var(--border);
      border-radius: 999px; padding: 5px 10px; font-family: inherit; cursor: pointer; }
    .why-actions { display: flex; gap: 8px; margin-top: 14px; }
    .why-actions button { flex: 1; padding: 13px; border-radius: 12px; font-family: inherit; font-size: 14px;
      font-weight: 600; cursor: pointer; }
    .why-cancel { border: 0.5px solid var(--border); background: var(--bg); color: var(--muted); }
    .why-go { border: none; background: var(--reject); color: #fff; }
    .why-go[disabled] { opacity: 0.4; }

    /* Stamps */
    .stamp { position: absolute; top: 28px; font-size: 28px; font-weight: 900; padding: 8px 16px; border-radius: 8px; opacity: 0; pointer-events: none; z-index: 10; letter-spacing: 3px; text-transform: uppercase; }
    .stamp.approve { left: 18px; color: #1D9E75; border: 4px solid #1D9E75; transform: rotate(-15deg); background: rgba(255,255,255,0.9); }
    .stamp.reject  { right: 18px; color: #E24B4A; border: 4px solid #E24B4A; transform: rotate(15deg); background: rgba(255,255,255,0.9); }
    .card-bg-overlay { position: absolute; inset: 0; border-radius: 20px; pointer-events: none; z-index: 1; opacity: 0; }

    /* Script card */
    .script-thumb { flex: 1; min-height: 0; background: #ebebeb; position: relative; overflow: hidden; }
    .script-source { padding: 8px 14px; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .script-source-label { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; }
    .script-source-handle { font-size: 11px; color: #1D9E75; font-weight: 600; }
    #s-swipe-zone { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .script-body { height: 42%; flex-shrink: 0; overflow-y: auto; padding: 0 0 16px; -webkit-overflow-scrolling: touch; border-top: 0.5px solid var(--border); }
    .script-section { padding: 12px 14px 0; }
    .script-label { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .script-text { font-size: 13px; line-height: 1.7; color: var(--text); word-break: break-word; }
    .script-divider { margin: 14px 14px; border: none; border-top: 1.5px dashed var(--border); }
    .script-katie { background: rgba(29,158,117,0.04); border-radius: 12px; padding: 12px; margin: 0 14px 16px; }
    .script-katie .script-label { color: #1D9E75; }

    /* Settings */
    .settings-screen { display: flex; flex-direction: column; flex: 1; min-height: 0; padding-top: 4px; }
    .settings-section-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .accounts-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; margin-bottom: 16px; }
    .account-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 12px 14px; }
    .account-info { flex: 1; min-width: 0; }
    .account-handle { font-size: 13px; font-weight: 600; color: var(--text); }
    .account-url { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .remove-btn { background: none; border: none; cursor: pointer; font-size: 20px; color: var(--muted); padding: 0; line-height: 1; flex-shrink: 0; }
    .remove-btn:active { color: var(--reject); }
    .add-row { display: flex; gap: 8px; margin-bottom: 16px; flex-shrink: 0; }
    .add-input { flex: 1; padding: 12px 14px; border: 0.5px solid var(--border); border-radius: 12px; font-size: 13px; font-family: inherit; background: var(--surface); color: var(--text); outline: none; }
    .add-input:focus { border-color: var(--approve); }
    .add-input::placeholder { color: var(--muted); }
    .add-btn { padding: 12px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; font-family: inherit; border: none; background: var(--approve); color: #fff; cursor: pointer; flex-shrink: 0; }
    .add-btn:active { opacity: 0.8; }
    .back-btn { width: 100%; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 600; font-family: inherit; border: 0.5px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; flex-shrink: 0; }

    /* Done / loading screens */
    .done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; padding: 2rem 1rem; overflow-y: auto; padding-top: max(2rem, 8vh); }
    .done .check { font-size: 48px; margin-bottom: 12px; }
    .done h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.4px; }
    .done > p { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    .pills { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    .pill { padding: 6px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; }
    .pill.a { background: var(--approve-bg); color: var(--approve); border: 0.5px solid var(--approve); }
    .pill.r { background: var(--reject-bg); color: var(--reject); border: 0.5px solid var(--reject); }
    .approved-list { width: 100%; border: 0.5px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 16px; text-align: left; max-height: 200px; overflow-y: auto; }
    .approved-item { padding: 11px 14px; border-bottom: 0.5px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .approved-item:last-child { border-bottom: none; }
    .approved-item .t { font-size: 13px; font-weight: 500; flex: 1; line-height: 1.3; }
    .approved-item .v { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .video-results { width: 100%; margin-bottom: 16px; text-align: left; display: flex; flex-direction: column; gap: 14px; }
    .video-result { border: 0.5px solid var(--border); border-radius: 14px; padding: 12px; }
    .video-result-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .video-result-head .t { font-size: 13px; font-weight: 500; }
    .btn-primary { width: 100%; padding: 15px; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; background: var(--approve); color: #fff; font-family: inherit; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { width: 100%; padding: 13px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; border: 0.5px solid var(--border); background: var(--surface); color: var(--text); margin-top: 10px; font-family: inherit; }
    .loading-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 2rem; }
    .loading-spinner { width: 36px; height: 36px; border: 3px solid rgba(0,0,0,0.08); border-top-color: var(--approve); border-radius: 50%; animation: spin-icon 0.8s linear infinite; }
    .loading-title { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
    .loading-sub { font-size: 13px; color: var(--muted); }

    /* Creator discovery */
    .creator-list { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding: 4px 0 16px; -webkit-overflow-scrolling: touch; }
    .creator-row { background: var(--surface); border: 0.5px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px; }
    .creator-row.starred { border-color: var(--approve); background: rgba(29,158,117,0.04); }
    .creator-main { flex: 1; min-width: 0; cursor: pointer; }

    /* Creator row: identity, then the shape of their posting, then the figures */
    .row-top { display: flex; align-items: center; gap: 10px; }
    .row-thumb { width: 34px; height: 44px; border-radius: 7px; object-fit: cover; background: #ebebeb; flex-shrink: 0; }
    .row-id { flex: 1; min-width: 0; }
    .row-handle { font-size: 13px; font-weight: 600; letter-spacing: -0.1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .row-score { text-align: right; flex-shrink: 0; line-height: 1.1; }
    .row-score-n { display: block; font-size: 20px; font-weight: 700; color: var(--approve); font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
    .row-score-l { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .row-score.none .row-score-n { color: var(--muted); opacity: 0.45; }

    /* Spark bars — height is the signal; the dashed rule is the breakout line */
    .spark { position: relative; height: 28px; margin: 10px 0 8px; }
    .spark-bars { display: flex; align-items: flex-end; gap: 2px; height: 100%; }
    .spark-bars span { flex: 1; background: #BDB7AB; border-radius: 1.5px; min-width: 2px; }
    .spark-bars span.hit { background: var(--approve); }
    .spark-rule { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed rgba(0,0,0,0.22); z-index: 1; }
    .spark-empty { font-size: 11px; color: var(--muted); margin: 10px 0 8px; opacity: 0.7; }

    .row-figs { display: flex; gap: 14px; font-size: 11px; color: var(--muted); }
    .row-figs b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

    /* A key instead of a paragraph — same information, one line, scannable */
    .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 10.5px; color: var(--muted); padding: 0 2px 10px; align-items: center; }
    .legend i { display: inline-block; width: 7px; height: 11px; border-radius: 1.5px; vertical-align: -1px; margin-right: 4px; }
    .legend .sw.hit { background: var(--approve); }
    .legend .sw.bar { background: #BDB7AB; }

    .blank { text-align: center; padding: 34px 20px; font-size: 13px; color: var(--muted); line-height: 1.6; }
    .blank-icon { font-size: 30px; margin-bottom: 10px; opacity: 0.55; }
    .list-foot { text-align: center; font-size: 10.5px; color: var(--muted); padding: 4px 0; opacity: 0.8; }

    /* Shortlist card — the thumbnail leads, since you judge a format by looking */
    .vid-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 14px; padding: 10px; display: flex; gap: 11px; cursor: pointer; }
    .vid-card:active { opacity: 0.7; }
    .vid-thumb-wrap { position: relative; flex-shrink: 0; }
    .vid-thumb-lg { width: 62px; height: 82px; border-radius: 9px; object-fit: cover; background: #ebebeb; display: block; }
    .vid-mult { position: absolute; left: 4px; bottom: 4px; background: var(--approve); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 999px; font-variant-numeric: tabular-nums; }
    .vid-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
    .vid-body .vid-caption { -webkit-line-clamp: 3; }
    .vid-body .vid-meta { margin-top: 0; }
    .vid-body .vid-meta b { color: var(--text); font-weight: 600; }
    .creator-handle { font-size: 13px; font-weight: 600; letter-spacing: -0.1px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .creator-stats { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
    .creator-bio { font-size: 11px; color: var(--muted); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.8; }
    .star-btn { background: none; border: none; cursor: pointer; font-size: 18px; line-height: 1; padding: 2px; flex-shrink: 0; opacity: 0.3; }
    .star-btn.on { opacity: 1; }
    .tag { font-size: 9px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
    .tag.tutorial { background: rgba(29,158,117,0.12); color: #1D9E75; }
    .tag.emotional { background: rgba(186,117,23,0.14); color: #96601a; }
    .tag.mixed, .tag.unknown { background: rgba(0,0,0,0.06); color: var(--muted); }
    .tag.hot { background: rgba(226,75,74,0.12); color: #c23b3a; }
    .tag.cam-talking_head { background: rgba(55,138,221,0.14); color: #2a6cb0; }
    .tag.cam-faceless { background: rgba(0,0,0,0.06); color: var(--muted); }
    .tag.cam-mixed { background: rgba(126,102,196,0.14); color: #5c47a0; }
    .tag.cam-unclear { background: rgba(0,0,0,0.04); color: var(--muted); }
    .tag.skit { background: rgba(186,117,23,0.14); color: #96601a; }
    .tag.repeat { background: rgba(29,158,117,0.14); color: #1D9E75; }
    .tag.mine { background: rgba(55,138,221,0.13); color: #2a6cb0; margin-left: 6px; font-size: 8.5px; padding: 2px 6px; vertical-align: 1px; }
    .metric { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text); }
    .vid-row { display: flex; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid var(--border); align-items: flex-start; }
    .vid-row:last-child { border-bottom: none; }
    .vid-thumb { width: 46px; height: 62px; border-radius: 7px; object-fit: cover; background: #ebebeb; flex-shrink: 0; }
    .vid-info { flex: 1; min-width: 0; }
    .vid-caption { font-size: 12px; line-height: 1.45; color: var(--text); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .vid-meta { font-size: 10px; color: var(--muted); margin-top: 4px; }
    .kw-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .kw-chip { background: var(--surface); border: 0.5px solid var(--border); border-radius: 999px; padding: 6px 10px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
    .kw-chip button { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 15px; line-height: 1; padding: 0; }
    .run-steps { display: flex; flex-direction: column; gap: 9px; margin-top: 8px; text-align: left; align-self: center; }
    .run-step { font-size: 12.5px; color: var(--muted); opacity: 0.45; display: flex; align-items: center; gap: 9px; white-space: nowrap; }
    .run-step i { font-style: normal; width: 16px; height: 16px; border-radius: 50%; background: rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; flex-shrink: 0; }
    .run-step.step-now { opacity: 1; color: var(--text); font-weight: 600; }
    .run-step.step-now i { background: var(--approve); color: #fff; }
    .run-step.step-done { opacity: 1; color: var(--approve); }
    .run-step.step-done i { background: var(--approve-bg); color: var(--approve); }
    .run-note { font-size: 11px; color: var(--muted); max-width: 250px; margin-top: 2px; }

    /* Home screen */
    .home-screen { flex: 1; display: flex; flex-direction: column; gap: 10px; padding-top: 4px; overflow-y: auto; }
    .stage-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: opacity 0.1s; }
    .stage-card:active { opacity: 0.7; }
    .stage-card.disabled { opacity: 0.4; cursor: not-allowed; }
    .stage-card.primary { border-color: var(--approve); background: rgba(29,158,117,0.05); }
    .stage-icon { font-size: 28px; flex-shrink: 0; width: 44px; text-align: center; }
    .stage-info { flex: 1; min-width: 0; }
    .stage-title { font-size: 14px; font-weight: 600; letter-spacing: -0.2px; margin-bottom: 3px; }
    .stage-meta { font-size: 11px; color: var(--muted); }
    .stage-arrow { font-size: 16px; color: var(--muted); flex-shrink: 0; }
    /* The count replaces the chevron: it says both "there's something here" and how much */
    .stage-num { flex-shrink: 0; text-align: right; font-size: 22px; font-weight: 700; color: var(--approve); line-height: 1; letter-spacing: -0.6px; font-variant-numeric: tabular-nums; }
    .stage-num small { display: block; font-size: 9px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 3px; }
    .stage-num.muted { color: var(--muted); opacity: 0.6; }
    .stage-run { flex-shrink: 0; background: var(--approve); color: #fff; font-size: 12px; font-weight: 700; padding: 7px 15px; border-radius: 999px; letter-spacing: -0.1px; }
    .stage-badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
    .stage-badge.ready { background: var(--approve-bg); color: var(--approve); }
    .stage-badge.empty { background: rgba(0,0,0,0.06); color: var(--muted); }
  </style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ── State ──────────────────────────────────────────────────────
const APP_VERSION = 'v57';
let formats = [];
let current = 0;
const approved = [], rejected = [];
let startX = 0, startY = 0, isDragging = false, dragX = 0;

// Stage 2
let scripts = [];       // [{format, script}, ...]
let scriptCurrent = 0;
const approvedScripts = [], rejectedScripts = [];

// Creators Ashitha has vetted by hand. The app no longer judges whether a
// creator is worth following — only whether a given video is worth remaking.
const DEFAULT_ACCOUNTS = [
  'https://www.tiktok.com/@wordy.adri',
  'https://www.tiktok.com/@learnwithmeera'
];

// ── Accounts ──────────────────────────────────────────────────
function loadAccounts() {
  try { const a = localStorage.getItem('kf_accounts'); if (a) return JSON.parse(a); } catch(e) {}
  return [...DEFAULT_ACCOUNTS];
}
function saveAccounts(a) { localStorage.setItem('kf_accounts', JSON.stringify(a)); }
function normaliseUrl(input) {
  input = input.trim();
  if (input.startsWith('https://www.tiktok.com/')) return input;
  if (input.startsWith('@')) return 'https://www.tiktok.com/' + input;
  if (input.includes('tiktok.com/')) return 'https://' + input.replace(/^https?:\/\//, '');
  return 'https://www.tiktok.com/@' + input.replace(/^@/, '');
}
function handleFromUrl(url) { const m = url.match(/@([^/?]+)/); return m ? '@' + m[1] : url; }

// ── Cache ──────────────────────────────────────────────────────
function saveCache(videos) {
  localStorage.setItem('kf_videos', JSON.stringify(videos));
  localStorage.setItem('kf_pulled', new Date().toISOString());
}
function loadCache() {
  try { const v = localStorage.getItem('kf_videos'); const t = localStorage.getItem('kf_pulled'); if (v && t) return { videos: JSON.parse(v), pulled: t }; } catch(e) {}
  return null;
}
function formatPulledDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}
function formatPosted(iso) {
  if (!iso) return null;
  const d = new Date(iso); if (isNaN(d)) return null;
  const diff = Math.floor((Date.now() - d) / 86400000);
  if (diff === 0) return 'Today'; if (diff === 1) return 'Yesterday';
  if (diff < 7) return diff + 'd ago';
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

// ── Header ─────────────────────────────────────────────────────
// With the video pull switched off, "last pulled" would be stuck on "Never"
// forever — so fall back to when creators were last scanned.
function lastPulledLabel(pulledAt) {
  if (SWIPE_STAGE_ENABLED) {
    return pulledAt ? 'Last pulled: ' + formatPulledDate(pulledAt) : 'Never pulled';
  }
  const scanned = localStorage.getItem('kf_creators_date');
  return scanned ? 'Last scan: ' + formatPulledDate(scanned) : 'No scan yet';
}

function headerHTML(pulledAt, countText, showHomeBtn=true, title='Format review') {
  return `
    <div class="header">
      <div class="header-left">
        ${showHomeBtn ? `<button onclick="showHome()" style="background:none;border:none;cursor:pointer;padding:0 0 3px 0;font-size:12px;color:var(--muted);font-family:inherit;display:block;">← Home</button>` : ''}
        <h1>${title}</h1>
        ${countText ? `<div class="total-count" id="total-count">${countText}</div>` : ''}
      </div>
      <div class="header-right">
        <div style="display:flex;align-items:center;gap:10px;">
          ${SWIPE_STAGE_ENABLED ? `<button class="refresh-btn" onclick="triggerRefresh()" id="refresh-btn">
            <span class="refresh-icon" id="refresh-icon">↻</span> Refresh
          </button>` : ''}
          <button class="icon-btn" onclick="showSettings()">⚙️</button>
        </div>
        <span class="last-pulled" id="last-pulled">${lastPulledLabel(pulledAt)}</span>
      </div>
    </div>`;
}

// ── Stage 1: Format card UI ────────────────────────────────────
function showCardUI(pulledAt) {
  current = 0; approved.length = 0; rejected.length = 0;
  document.getElementById('app').innerHTML = `
    ${headerHTML(pulledAt, formats.length + ' videos to review' + (Number(localStorage.getItem('kf_screened_out')) > 0 ? ' · ' + localStorage.getItem('kf_screened_out') + ' filtered out' : ''), true, 'Format review')}
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:${100/formats.length}%"></div></div>
    <div class="card-area">
      <div class="card-stack">
        <div class="deck-card deck-card-3"></div>
        <div class="deck-card deck-card-2"></div>
        <div class="card" id="card">
          <div class="stamp approve" id="stamp-a">APPROVE</div>
          <div class="stamp reject" id="stamp-r">SKIP</div>
          <div class="card-bg-overlay" id="bg-overlay"></div>
          <div class="video-frame" id="video-frame"><div class="video-loading"><div class="spinner"></div><span>Loading...</span></div></div>
          <div class="meta" id="meta"></div>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:12px;padding:12px 10px 0;flex-shrink:0;">
      <button onclick="swipe('left')" style="flex:1;padding:14px;border-radius:14px;font-size:14px;font-weight:600;border:0.5px solid var(--border);background:var(--surface);color:var(--reject);cursor:pointer;font-family:inherit;">✕ Skip</button>
      <button onclick="swipe('right')" style="flex:1;padding:14px;border-radius:14px;font-size:14px;font-weight:600;border:none;background:var(--approve);color:#fff;cursor:pointer;font-family:inherit;">✓ Approve</button>
    </div>`;
  attachTouchEvents();
  document.onkeydown = (e) => { if (e.key === 'ArrowRight') swipe('right'); else if (e.key === 'ArrowLeft') swipe('left'); };
  loadCard(0);
}

async function loadCard(idx) {
  const vf = document.getElementById('video-frame');
  const meta = document.getElementById('meta');
  const prog = document.getElementById('progress');
  const tc = document.getElementById('total-count');
  const f = formats[idx];
  if (prog) prog.style.width = `${((idx+1)/formats.length)*100}%`;
  if (tc) tc.textContent = `${idx+1} / ${formats.length} videos`;
  vf.innerHTML = '<div class="video-loading"><div class="spinner"></div><span>Loading...</span></div>';
  const posted = formatPosted(f.created);
  meta.innerHTML = `
    <div class="meta-top">
      <div class="meta-top-left">
        <span class="badge">@${f.author || 'tiktok'}</span>
        ${posted ? `<span class="posted-date">${posted}</span>` : ''}
      </div>
      <a class="comments-link" href="${f.url}" target="_blank">💬 Comments</a>
    </div>
    <div class="card-title">${f.title}</div>
    <div class="views">♥ ${f.views} likes &nbsp;·&nbsp; 💬 ${f.comments || '–'} comments${
      f.outlierRatio > 1 ? ` &nbsp;·&nbsp; ${f.outlierRatio}× their normal` : ''}</div>
    ${f.topic ? `<div class="screen-tags">
      <span class="screen-topic">${f.topic}</span>
      ${f.contentType ? `<span class="screen-chip">${f.contentType}</span>` : ''}
      ${f.makeListicle ? `<span class="screen-chip listicle">make it a listicle</span>` : ''}
    </div>` : ''}`;
  if (f.thumbnail) showThumb(vf, f.thumbnail, f.url);
  else {
    try {
      const res = await fetch(`/api/oembed?url=${encodeURIComponent(f.url)}`);
      const data = await res.json();
      if (data.thumbnail_url) showThumb(vf, data.thumbnail_url, f.url);
      else showFallback(vf, f.url);
    } catch { showFallback(vf, f.url); }
  }
}

function showThumb(vf, thumb, url) {
  vf.innerHTML = `
    <a href="${url}" target="_blank" style="display:block;width:100%;height:100%;position:relative;text-decoration:none;">
      <img src="${thumb}" style="width:100%;height:100%;object-fit:cover;display:block;" />
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,0.35);">
        <div style="width:56px;height:56px;background:rgba(255,255,255,0.95);border-radius:50%;display:flex;align-items:center;justify-content:center;">
          <div style="width:0;height:0;border-style:solid;border-width:10px 0 10px 20px;border-color:transparent transparent transparent #000;margin-left:4px;"></div>
        </div>
        <span style="color:#fff;font-size:13px;font-weight:600;background:rgba(0,0,0,0.5);padding:5px 14px;border-radius:999px;">Watch on TikTok</span>
      </div>
    </a>`;
}
function showFallback(vf, url) {
  vf.innerHTML = `<div class="video-loading"><span>Preview unavailable</span><a class="watch-link" href="${url}" target="_blank">Watch on TikTok →</a></div>`;
}

// ── Why-skip ───────────────────────────────────────────────────
// A rejection is only useful later if we know which kind it was. Three kinds,
// and they mean opposite things: a new standing rule, the screener getting
// this one wrong, or a one-off with no lesson in it. Lumped together they
// cancel each other out — the engine that reads these is task #6.
const WHY_KINDS = [
  { id: 'rule',       label: 'Never show me these again',
    hint: 'A standing rule — the whole kind of video is wrong for us' },
  { id: 'correction', label: 'The filter got this one wrong',
    hint: 'It should have caught this — a skit, a repeat, British English' },
  { id: 'oneoff',     label: 'Just this one',
    hint: 'Nothing to learn from — fine idea, wrong video' }
];

let whyPick = null;

function loadRecentReasons() {
  try { return JSON.parse(localStorage.getItem('kf_recent_reasons') || '[]'); } catch(e) { return []; }
}
// Typing on a phone is friction, and friction is what kills feedback loops.
// Reasons already used come back as one-tap chips, newest first.
function rememberReason(text) {
  if (!text) return;
  const list = [text, ...loadRecentReasons().filter(r => r !== text)].slice(0, 8);
  localStorage.setItem('kf_recent_reasons', JSON.stringify(list));
}

function openWhySheet() {
  whyPick = null;
  const recent = loadRecentReasons();
  const el = document.createElement('div');
  el.id = 'why-wrap';
  el.innerHTML = `
    <div class="why-backdrop" onclick="closeWhySheet()"></div>
    <div class="why-sheet">
      <div class="why-title">Why skip it?</div>
      <div class="why-sub">${formats[current]?.topic || formats[current]?.title?.slice(0, 60) || ''}</div>
      ${WHY_KINDS.map(k => `
        <button class="why-opt" id="why-${k.id}" onclick="pickWhy('${k.id}')">
          ${k.label}<small>${k.hint}</small>
        </button>`).join('')}
      <input class="why-input" id="why-text" type="text" placeholder="In your words (optional)" />
      ${recent.length ? `<div class="why-recent">${recent.map(r =>
        `<button onclick="useReason(this.textContent)">${r}</button>`).join('')}</div>` : ''}
      <div class="why-actions">
        <button class="why-cancel" onclick="closeWhySheet()">Cancel</button>
        <button class="why-go" id="why-go" disabled onclick="confirmWhy()">Skip it</button>
      </div>
    </div>`;
  document.body.appendChild(el);
}

function pickWhy(id) {
  whyPick = id;
  WHY_KINDS.forEach(k => document.getElementById('why-' + k.id)?.classList.toggle('sel', k.id === id));
  const go = document.getElementById('why-go');
  if (go) go.disabled = false;
}

function useReason(text) {
  const input = document.getElementById('why-text');
  if (input) input.value = text;
}

function closeWhySheet() {
  document.getElementById('why-wrap')?.remove();
  // The card was dragged part-way off before the sheet opened — put it back.
  const card = document.getElementById('card');
  if (card) card.style.transform = '';
  ['stamp-a','stamp-r','bg-overlay'].forEach(id => {
    const el = document.getElementById(id); if (el) el.style.opacity = 0;
  });
}

function confirmWhy() {
  const reason = document.getElementById('why-text')?.value.trim() || '';
  const kind = whyPick;
  rememberReason(reason);
  document.getElementById('why-wrap')?.remove();
  doSwipe('left', { kind, reason });
}

// ── Stage 1: Swipe ─────────────────────────────────────────────
// Rejecting asks why first; approving doesn't. An approval carries no
// information beyond itself, and stopping to explain every yes would make
// swiping through sixty videos unbearable.
function swipe(dir) {
  if (current >= formats.length) return;
  if (dir === 'left') { openWhySheet(); return; }
  doSwipe(dir, null);
}

function doSwipe(dir, why) {
  if (current >= formats.length) return;
  const card = document.getElementById('card');
  // A drag leaves an inline transform behind, and inline beats the class the
  // fly-away animation uses. Clear it or the card just sits there.
  card.style.transform = '';
  card.classList.add('animating', dir === 'right' ? 'fly-right' : 'fly-left');
  if (dir === 'right') approved.push(formats[current]);
  else rejected.push({ ...formats[current], whyKind: why?.kind || '', whyReason: why?.reason || '' });
  current++;
  setTimeout(() => {
    card.classList.remove('animating','fly-right','fly-left');
    card.style.transform = '';
    ['stamp-a','stamp-r','bg-overlay'].forEach(id => { const el = document.getElementById(id); if (el) el.style.opacity = 0; });
    if (current >= formats.length) { saveApprovedFormats(approved); showStage1Done(); }
    else loadCard(current);
  }, 400);
}

// Send the whole session's swipes to the Decisions tab. Fire and forget: a
// failed log must never block the review, but it is retried once, because a
// lost rejection is a lesson gone for good.
//
// Reviewing the same batch again appends a second row rather than replacing
// the first. Changing your mind is itself worth knowing about, so whoever
// reads this later takes the newest row per video and keeps the rest.
async function logDecisions() {
  const rows = [
    ...approved.map(f => ({ ...f, swipe: 'approve' })),
    ...rejected.map(f => ({ ...f, swipe: 'reject' }))
  ].map(f => ({
    url: f.url, author: f.author, topic: f.topic || '', contentType: f.contentType || '',
    screenerVerdict: 'keep', screenerReasons: '',
    swipe: f.swipe, whyKind: f.whyKind || '', whyReason: f.whyReason || ''
  }));
  if (!rows.length) return;

  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const res = await fetch('/api/sheets', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'decisions', rows })
      });
      const data = await res.json();
      if (data.ok) { localStorage.removeItem('kf_unlogged'); return; }
    } catch (e) {}
  }
  // Out of retries — keep them on the phone so nothing is silently lost.
  localStorage.setItem('kf_unlogged', JSON.stringify(rows));
}

// ── Stage 1: Done ──────────────────────────────────────────────
function showStage1Done() {
  logDecisions();
  const pulled = localStorage.getItem('kf_pulled');
  document.getElementById('app').innerHTML = `
    ${headerHTML(pulled, null, true, 'Format review')}
    <div class="done">
      <div class="check">✓</div>
      <h2>Formats reviewed</h2>
      <p>${approved.length} approved · ${rejected.length} skipped</p>
      ${rejected.filter(r => r.whyKind).length ? `
        <div class="approved-list" style="margin-bottom:14px;">
          ${rejected.filter(r => r.whyKind).map(r => `
            <div class="approved-item">
              <span class="t">${r.whyReason || r.topic || r.title}</span>
              <span class="v">${(WHY_KINDS.find(k => k.id === r.whyKind) || {}).label?.split(' ')[0] || ''}</span>
            </div>`).join('')}
        </div>` : ''}
      ${approved.length > 0 ? `
        <div class="approved-list">
          ${approved.map(f => `<div class="approved-item"><span class="t">${f.title}</span><span class="v">♥ ${f.views}</span></div>`).join('')}
        </div>
        ${SCRIPT_STAGE_ENABLED ? `<button class="btn-primary" onclick="startScriptGeneration()">Continue to scripts →</button>` : ''}
      ` : '<p style="color:var(--muted);font-size:14px;margin-bottom:16px;">No formats approved.</p>'}
      <button class="btn-secondary" onclick="reviewFormatsAgain()">Review again</button>
      <button class="btn-secondary" onclick="showHome()">← Home</button>
    </div>`;
}
function reviewFormatsAgain() {
  approved.length = 0; rejected.length = 0;
  saveApprovedFormats([]);
  ['kf_generated_scripts','kf_generated_scripts_date','kf_approved_scripts','kf_approved_scripts_date','kf_generated_videos','kf_generated_videos_date'].forEach(k=>localStorage.removeItem(k));
  current = 0;
  showCardUI(localStorage.getItem('kf_pulled'));
}

// ── Stage 2: Generate scripts ──────────────────────────────────
async function startScriptGeneration() {
  const cached = loadGeneratedScripts();
  if (cached && cached.length > 0) { scripts = cached; showScriptUI(); return; }
  const pulled = localStorage.getItem('kf_pulled');
  document.getElementById('app').innerHTML = `
    ${headerHTML(pulled, null, true, 'Script review')}
    <div class="loading-screen">
      <div class="loading-spinner"></div>
      <div class="loading-title" id="loading-title">Transcribing videos...</div>
      <div class="loading-sub" id="loading-sub">This may take a minute</div>
    </div>`;

  const setStatus = (title, sub) => {
    const t = document.getElementById('loading-title');
    const s = document.getElementById('loading-sub');
    if (t) t.textContent = title;
    if (s) s.textContent = sub;
  };

  try {
    // Step 1: Transcribe all approved videos
    setStatus('Transcribing videos...', `0 / ${approved.length} done`);
    const transcriptRes = await fetch('/api/transcript', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ urls: approved.map(f => f.url) })
    });
    const transcriptData = await transcriptRes.json();
    const transcripts = transcriptData.transcripts || {};

    // Step 2: Generate script for each approved video
    scripts = [];
    for (let i = 0; i < approved.length; i++) {
      const f = approved[i];
      setStatus(`Generating script ${i+1} of ${approved.length}...`, f.title.slice(0, 50) + '...');
      const genRes = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          transcript: transcripts[f.url] || '',
          caption: f.title,
          author: f.author
        })
      });
      const genData = await genRes.json();
      scripts.push({ format: f, script: genData.script || '', transcript: transcripts[f.url] || '' });
    }

    // Step 3: Show script review
    saveGeneratedScripts(scripts);
    showScriptUI();

  } catch (err) {
    console.error(err);
    document.getElementById('app').innerHTML = `
      ${headerHTML(null, null, true, 'Generate videos')}
      <div class="done">
        <div class="check">⚠️</div>
        <h2>Something went wrong</h2>
        <p>${err.message}</p>
        <button class="btn-primary" onclick="startScriptGeneration()">Try again</button>
        <button class="btn-secondary" onclick="showStage1Done()">Back</button>
      </div>`;
  }
}

// ── Stage 2: Script swipe UI ───────────────────────────────────
function showScriptUI() {
  scriptCurrent = 0; approvedScripts.length = 0; rejectedScripts.length = 0;
  const pulled = localStorage.getItem('kf_pulled');
  document.getElementById('app').innerHTML = `
    ${headerHTML(pulled, 'Script review', true, 'Script review')}
    <div class="progress-bar"><div class="progress-fill" id="s-progress" style="width:${100/scripts.length}%"></div></div>
    <div class="card-area">
      <div class="card-stack">
        <div class="deck-card deck-card-3"></div>
        <div class="deck-card deck-card-2"></div>
        <div class="card" id="s-card">
          <div class="stamp approve" id="s-stamp-a">APPROVE</div>
          <div class="stamp reject" id="s-stamp-r">SKIP</div>
          <div class="card-bg-overlay" id="s-bg-overlay"></div>
          <div id="s-swipe-zone">
            <div class="script-thumb" id="s-thumb"></div>
            <div class="script-source">
              <span class="script-source-label">Source</span>
              <span class="script-source-handle" id="s-handle"></span>
              <a id="s-link" href="#" target="_blank" style="margin-left:auto;font-size:11px;color:#5DCAA5;text-decoration:none;">View ↗</a>
              <span style="font-size:10px;color:var(--muted);margin-left:8px;" id="s-count">1/${scripts.length}</span>
            </div>
          </div>
          <div class="script-body" id="s-body">
            <div class="script-section">
              <div class="script-label">Original</div>
              <div class="script-text" id="s-original"></div>
            </div>
            <hr class="script-divider" />
            <div class="script-katie">
              <div class="script-label">Katie AI version</div>
              <div class="script-text" id="s-text"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:12px;padding:12px 10px 0;flex-shrink:0;">
      <button onclick="swipeScript('left')" style="flex:1;padding:14px;border-radius:14px;font-size:14px;font-weight:600;border:0.5px solid var(--border);background:var(--surface);color:var(--reject);cursor:pointer;font-family:inherit;">✕ Skip</button>
      <button onclick="swipeScript('right')" style="flex:1;padding:14px;border-radius:14px;font-size:14px;font-weight:600;border:none;background:var(--approve);color:#fff;cursor:pointer;font-family:inherit;">✓ Approve</button>
    </div>`;
  attachScriptTouchEvents();
  document.onkeydown = (e) => { if (e.key === 'ArrowRight') swipeScript('right'); else if (e.key === 'ArrowLeft') swipeScript('left'); };
  loadScriptCard(0);
}

function formatTranscript(text) {
  if (!text) return 'No transcript available.';
  // Split on sentence endings followed by space/caps, clean up
  return text
    .replace(/([.!?])\s+([A-Z])/g, '$1\n$2')
    .replace(/([.!?])\s+(It means|Means|That means)/g, '$1\n$2')
    .trim();
}

function loadScriptCard(idx) {
  const s = scripts[idx];
  const prog = document.getElementById('s-progress');
  const count = document.getElementById('s-count');
  const thumb = document.getElementById('s-thumb');
  const handle = document.getElementById('s-handle');
  const link = document.getElementById('s-link');
  const text = document.getElementById('s-text');
  const original = document.getElementById('s-original');
  const body = document.getElementById('s-body');
  if (prog) prog.style.width = `${((idx+1)/scripts.length)*100}%`;
  if (count) count.textContent = `${idx+1}/${scripts.length}`;
  if (handle) handle.textContent = '@' + (s.format.author || 'unknown');
  if (link) link.href = s.format.url;
  if (text) text.textContent = s.script;
  if (original) original.textContent = formatTranscript(s.transcript);
  if (body) body.scrollTop = 0;
  if (thumb) {
    if (s.format.thumbnail) {
      thumb.innerHTML = `<a href="${s.format.url}" target="_blank" style="display:block;width:100%;height:100%;"><img src="${s.format.thumbnail}" style="width:100%;height:100%;object-fit:cover;" /></a>`;
    } else {
      thumb.innerHTML = `<div class="video-loading"><span style="font-size:12px;color:var(--muted)">No thumbnail</span></div>`;
    }

}

function swipeScript(dir) {
  if (scriptCurrent >= scripts.length) return;
  const card = document.getElementById('s-card');
  card.classList.add('animating', dir === 'right' ? 'fly-right' : 'fly-left');
  if (dir === 'right') approvedScripts.push(scripts[scriptCurrent]);
  else rejectedScripts.push(scripts[scriptCurrent]);
  scriptCurrent++;
  setTimeout(() => {
    card.classList.remove('animating','fly-right','fly-left');
    card.style.transform = '';
    ['s-stamp-a','s-stamp-r','s-bg-overlay'].forEach(id => { const el = document.getElementById(id); if (el) el.style.opacity = 0; });
    if (scriptCurrent >= scripts.length) { saveApprovedScripts(approvedScripts); showStage2Done(); }
    else loadScriptCard(scriptCurrent);
  }, 400);
}

function attachScriptTouchEvents() {
  const card = document.getElementById('s-card');
  const swipeZone = document.getElementById('s-swipe-zone');
  if (!card || !swipeZone) return;
  let sX = 0, sY = 0, dragging = false, dX = 0;

  // Only start swipe detection from the swipe zone (thumb + source bar)
  swipeZone.addEventListener('touchstart', e => {
    sX = e.touches[0].clientX; sY = e.touches[0].clientY;
    dragging = true; dX = 0;
  }, { passive: true });

  // Move can propagate from anywhere on the card
  card.addEventListener('touchmove', e => {
    if (!dragging) return;
    dX = e.touches[0].clientX - sX;
    const dY = e.touches[0].clientY - sY;
    if (Math.abs(dX) < Math.abs(dY) && Math.abs(dX) < 10) { dragging = false; return; }
    card.style.transform = `translateX(${dX}px) rotate(${dX * 0.06}deg)`;
    const progress = Math.abs(dX) > 30 ? Math.min((Math.abs(dX) - 30) / 70, 1) : 0;
    const sa = document.getElementById('s-stamp-a');
    const sr = document.getElementById('s-stamp-r');
    const ov = document.getElementById('s-bg-overlay');
    if (sa) sa.style.opacity = dX > 30 ? progress : 0;
    if (sr) sr.style.opacity = dX < -30 ? progress : 0;
    if (ov) { ov.style.background = dX > 30 ? 'rgba(29,158,117,0.15)' : dX < -30 ? 'rgba(226,75,74,0.15)' : 'transparent'; ov.style.opacity = progress; }
  }, { passive: true });

  card.addEventListener('touchend', () => {
    if (!dragging) return; dragging = false;
    if (dX > 80) swipeScript('right');
    else if (dX < -80) swipeScript('left');
    else {
      card.style.transform = '';
      ['s-stamp-a','s-stamp-r','s-bg-overlay'].forEach(id => { const el = document.getElementById(id); if (el) el.style.opacity = 0; });
    }
  });
}

// Prompt style toggle: 'detailed' (full movement+setting) or 'simple'
// (spoken line + one gesture cue; the Norah first frame carries the scene).
function promptStyle() { return localStorage.getItem('kf_prompt_style') === 'simple' ? 'simple' : 'detailed'; }

let generatedVideos = [];

// kie.ai status values that mean "still running"
const KIE_PENDING = new Set(['waiting', 'queuing', 'generating', 'processing']);

// Render the Omni prompt text to a PNG (the "image-prompt hack").
// Black text on white, ~1200x900, word-wrapped. Returns base64 (no data: prefix).
function renderPromptToPng(promptText) {
  const W = 1200, H = 900;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#000000';
  ctx.font = '24px Arial, sans-serif';
  ctx.textBaseline = 'top';

  const margin = 50;
  const maxWidth = W - margin * 2;
  const lineHeight = 34;
  let y = 40;

  const wrapLine = (text) => {
    const words = text.split(' ');
    const lines = [];
    let cur = '';
    for (const word of words) {
      const test = cur ? cur + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && cur) {
        lines.push(cur);
        cur = word;
      } else {
        cur = test;
      }
    }
    if (cur) lines.push(cur);
    return lines;
  };

  for (const paragraph of promptText.split('\n')) {
    if (paragraph.trim() === '') { y += 18; continue; }
    for (const line of wrapLine(paragraph)) {
      ctx.fillText(line, margin, y);
      y += lineHeight;
    }
  }

  // strip the "data:image/png;base64," prefix
  return canvas.toDataURL('image/png').split(',')[1];
}

// Split a script into N clips as evenly as possible, snapping to sentence/word breaks
function splitScriptIntoClips(script, numClips) {
  if (numClips <= 1) return [script];
  // Break into sentence-ish units (keep the delimiter)
  const units = script.match(/[^.!?]+[.!?]*\s*/g) || [script];
  // If too few sentences to split, fall back to word chunks
  if (units.length < numClips) {
    const words = script.trim().split(/\s+/);
    const per = Math.ceil(words.length / numClips);
    const parts = [];
    for (let i = 0; i < numClips; i++) parts.push(words.slice(i*per, (i+1)*per).join(' '));
    return parts.filter(p => p.trim());
  }
  // Distribute sentences across clips as evenly as possible
  const perClip = Math.ceil(units.length / numClips);
  const parts = [];
  for (let i = 0; i < numClips; i++) {
    parts.push(units.slice(i*perClip, (i+1)*perClip).join('').trim());
  }
  return parts.filter(p => p.trim());
}

// Heuristic: does this failure message look like a content-policy rejection?
function isPolicyReason(msg) {
  return /policy|sensitive|nsfw|violat|inappropriate|flagged|prohibited|not allowed|safety|blocked/i.test(String(msg || ''));
}

// Varied, brand-safe casual outfits so Norah isn't in the same top every video.
// Upper-body focused (waist-up UGC framing), cozy-bedroom appropriate, modest.
const NORAH_OUTFITS = [
  'a cream oversized knit sweater',
  'a white ribbed tank top',
  'a light blue denim jacket over a plain white tee',
  'a sage green pullover hoodie',
  'a soft beige cardigan over a white top',
  'a pastel pink crewneck sweatshirt',
  'a black fitted long-sleeve top',
  'a blue-and-white striped long-sleeve shirt',
  'a mustard-yellow knit jumper',
  'a lavender relaxed-fit t-shirt',
  'a white linen button-up shirt',
  'a charcoal-grey zip-up hoodie',
  'a terracotta ribbed long-sleeve top',
  'a light olive utility overshirt over a white tee'
];
function pickOutfit(exclude) {
  const pool = NORAH_OUTFITS.filter(o => o !== exclude);
  return pool[Math.floor(Math.random() * pool.length)];
}

// Submit the Norah first-frame swap, then poll status until the image is ready.
// Returns the image URL, or null if it fails/times out (caller falls back to
// the bundled avatar). ~90s ceiling — well beyond nano-banana's usual 10-30s.
async function makeNorahFrame(refFrameB64, outfit) {
  const sr = await fetch('/api/omni', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'firstframe', firstFrame: refFrameB64, outfit: outfit || null })
  });
  const sd = await sr.json();
  if (!sr.ok || !sd.taskId) throw new Error(sd.error || 'firstframe submit failed');

  for (let i = 0; i < 30; i++) {
    await new Promise(r => setTimeout(r, 3000));
    let pd;
    try {
      const pr = await fetch(`/api/omni?action=status&taskId=${sd.taskId}`);
      pd = await pr.json();
    } catch (e) {
      continue; // transient network/poll error — keep trying
    }
    if (pd.status === 'success' && pd.videoUrl) return pd.videoUrl; // image URL
    if (pd.status === 'fail') {
      // Real rejection from kie (often content-policy) — surface it verbatim
      const err = new Error(pd.failMsg || 'swap rejected (no reason given)');
      err.rejected = true;
      throw err;
    }
  }
  throw new Error('first-frame swap timed out (>90s)');
}

async function safeGenerate() {
  const btn = document.getElementById('generate-btn');
  if (btn) { btn.textContent = 'Starting…'; }
  try {
    await generateVideos();
  } catch (e) {
    alert('Generate failed: ' + (e && e.message ? e.message : e));
    if (btn) { btn.textContent = 'Generate videos →'; }
  }
}

async function generateVideos() {
  const pulled = localStorage.getItem('kf_pulled');

  // Always reload approved scripts from storage so the array is never stale/empty
  const savedScripts = loadApprovedScripts() || [];
  const validScripts = savedScripts.filter(s => s && s.format);
  if (!validScripts.length) {
    document.getElementById('app').innerHTML = `
      ${headerHTML(pulled, null, true, 'Generate videos')}
      <div class="loading-screen">
        <div style="font-size:40px;margin-bottom:16px;">📝</div>
        <div style="font-weight:600;margin-bottom:8px;">No approved scripts yet</div>
        <div style="color:var(--muted);font-size:13px;margin-bottom:24px;max-width:300px;text-align:center;">
          Pull fresh videos, approve a format, then approve a script — then come back here to generate.
        </div>
        <button class="btn-primary" onclick="showHome()">← Start from Home</button>
      </div>`;
    return;
  }
  // Repopulate the approvedScripts array in place (it's a const — can't reassign)
  approvedScripts.length = 0;
  validScripts.forEach(s => approvedScripts.push(s));
  // Fresh generation — clear any stale generated-video cache
  ['kf_generated_videos','kf_generated_videos_date'].forEach(k=>localStorage.removeItem(k));
  generatedVideos = [];
  document.getElementById('app').innerHTML = `
    ${headerHTML(pulled, null, true, 'Generate videos')}
    <div class="loading-screen">
      <div class="loading-spinner"></div>
      <div class="loading-title" id="loading-title">Building Omni prompts...</div>
      <div class="loading-sub" id="loading-sub">Submitting to kie.ai — ~2 min per video</div>
    </div>`;

  const setStatus = (title, sub) => {
    const t = document.getElementById('loading-title');
    const s = document.getElementById('loading-sub');
    if (t) t.textContent = title;
    if (s) s.textContent = sub;
  };

  try {
    // PHASE 1: For each script — watch video, decide clip count, build one prompt per clip
    const prepared = [];
    for (let i = 0; i < approvedScripts.length; i++) {
      const s = approvedScripts[i];
      const scriptText = s.script || s.text || s.katie_script || '';

      // 1a. Require the source video; get the REAL motion breakdown + duration
      let motionBreakdown = null;
      let duration = 0;
      if (!s.format?.videoFile) {
        throw new Error(`No video file for @${s.format?.author || '?'} — this format was pulled before video download was enabled. Reset app data and pull fresh.`);
      }
      setStatus(`Watching video ${i+1} of ${approvedScripts.length}...`, '@' + s.format.author);
      const ar = await fetch('/api/omni', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'analyze', videoFile: s.format.videoFile, script: scriptText })
      });
      const ad = await ar.json();
      if (!ar.ok || ad.error) {
        throw new Error(`Analyze failed (${ar.status}): ${ad.error || 'unknown'}`);
      }
      if (!ad.motionBreakdown) {
        throw new Error('Analyze returned no motion breakdown');
      }
      motionBreakdown = ad.motionBreakdown;
      duration = ad.duration || 0;

      // 1a-ii. Generate the Norah-swapped first frame (keeps ref background/pose,
      //        swaps the person to Norah). Per video, shared by all its clips.
      //        Non-fatal: on failure we fall back to the bundled avatar.
      let norahFrameUrl = null;
      let frameErr = null;
      let norahOutfit = pickOutfit();
      if (ad.firstFrame) {
        setStatus(`Creating Norah first frame ${i+1} of ${approvedScripts.length}...`, norahOutfit);
        try {
          norahFrameUrl = await makeNorahFrame(ad.firstFrame, norahOutfit);
        } catch (e) {
          frameErr = { rejected: !!e.rejected || isPolicyReason(e.message), msg: (e.message || String(e)) };
        }
      } else {
        frameErr = { rejected: false, msg: 'decode returned no first frame (redeploy pending?)' };
      }

      // 1b. Decide clip count: <=10s → 1, 10-25s → 2, >25s → 3
      const numClips = duration > 25 ? 3 : (duration > 10 ? 2 : 1);
      const scriptParts = splitScriptIntoClips(scriptText, numClips);

      // 1c. Build one Omni prompt per clip
      for (let c = 0; c < scriptParts.length; c++) {
        setStatus(`Writing prompt ${i+1}.${c+1} (clip ${c+1}/${numClips})...`, '@' + s.format.author);
        const pr = await fetch('/api/omni', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'prompt',
            style: promptStyle(),
            script: scriptParts[c],
            thumbnail: s.format?.thumbnail || null,
            motionBreakdown,
            clipInfo: numClips > 1 ? { index: c+1, total: numClips } : null
          })
        });
        const pd = await pr.json();
        if (!pr.ok || pd.error) throw new Error(`Prompt (${pr.status}): ${pd.error || JSON.stringify(pd)}`);
        prepared.push({
          scriptObj: s,
          promptText: pd.promptText,
          clipLabel: numClips > 1 ? `Clip ${c+1} of ${numClips}` : null,
          videoIndex: i,
          norahFrameUrl,
          norahOutfit,
          frameErr,
          refFirstFrame: ad.firstFrame || null
        });
      }
    }

    // Hand off to the review screen — generation happens only after approval
    window.__preparedPrompts = prepared;
    savePreparedPrompts(prepared);
    showPromptReview(prepared);
    return;
  } catch (err) {
    document.getElementById('app').innerHTML = `
      ${headerHTML(localStorage.getItem('kf_pulled'), null, true, 'Generate videos')}
      <div class="loading-screen">
        <div style="font-size:40px;margin-bottom:16px;">⚠️</div>
        <div style="font-weight:600;margin-bottom:8px;">Something went wrong</div>
        <div style="color:var(--muted);font-size:13px;margin-bottom:24px;max-width:300px;text-align:center;">${err.message}</div>
        <button class="btn-secondary" onclick="generateVideos()">Try again</button>
        <button class="btn-secondary" onclick="showHome()">← Home</button>
      </div>`;
    return;
  }
}

          Review each Omni prompt before generating. Only approved ones will be sent (each costs a generation).
        </div>
        ${prepared.map((p, i) => `
          <div style="border:0.5px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;${approved.has(i)?'':'opacity:0.45;'}">

              <span style="font-size:13px;font-weight:600;">@${p.scriptObj.format.author}${p.clipLabel ? ` · <span style="color:var(--accent,#6C5CE7);">${p.clipLabel}</span>` : ''}</span>
            </div>

            <div style="margin:0 0 10px;">
              ${p.norahFrameUrl
                ? `<div style="font-size:11px;color:var(--muted);margin-bottom:6px;">Norah first frame (start image for this video)${p.norahOutfit ? ` · <span style="color:var(--accent,#6C5CE7);">${p.norahOutfit}</span>` : ''}</div>
                   <img src="${p.norahFrameUrl}" style="width:96px;border-radius:8px;border:0.5px solid var(--border);display:block;margin-bottom:6px;" />`
                : `<div style="font-size:11px;color:var(--reject);margin-bottom:2px;font-weight:600;">
                     ${p.frameErr && p.frameErr.rejected ? '⚠ Swap rejected by content policy' : '⚠ Swap failed'} — using default avatar
                   </div>
                   ${p.frameErr && p.frameErr.msg ? `<div style="font-size:10px;color:var(--muted);margin-bottom:6px;word-break:break-word;">${String(p.frameErr.msg).replace(/</g,'&lt;').slice(0,240)}</div>` : ''}`}
              <button onclick="regenerateFirstFrame(${i})" class="btn-secondary" style="font-size:12px;padding:8px;">↻ Regenerate first frame</button>

              ${approved.has(i) ? '✓ Will generate — tap to skip' : '✕ Skipped — tap to include'}
            </button>
          </div>`).join('')}
        <button class="btn-primary" onclick="generateApprovedPrompts()" style="margin-top:8px;">
          Generate approved (${approved.size}) →
        </button>
        <button class="btn-secondary" onclick="showHome()">← Home</button>
        <button onclick="reanalyzeFromScratch()" style="background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit;display:block;margin:14px auto 0;">↻ Re-analyze from scratch</button>
      </div>`;
  };
