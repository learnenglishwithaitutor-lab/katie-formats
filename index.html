<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F0EEE9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Katie Formats" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Katie Formats</title>
  <!-- BUST-v48 -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F0EEE9; --surface: #FFFFFF;
      --border: rgba(0,0,0,0.08); --text: #1a1a1a; --muted: #888;
      --approve: #1D9E75; --approve-bg: rgba(29,158,117,0.1);
      --reject: #E24B4A; --reject-bg: rgba(226,75,74,0.1);
    }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      overflow: hidden; -webkit-tap-highlight-color: transparent;
    }
    .app {
      display: flex; flex-direction: column; height: 100dvh;
      padding: env(safe-area-inset-top,16px) 16px env(safe-area-inset-bottom,20px);
      max-width: 480px; margin: 0 auto;
    }

    /* Header */
    .header { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 0 10px; flex-shrink: 0; }
    .header-left h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
    .header-left .total-count { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
    
    .icon-btn { background: none; border: none; cursor: pointer; padding: 0; font-size: 14px; line-height: 1; color: var(--muted); }
    .icon-btn:active { opacity: 0.5; }
    .refresh-btn { background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; gap: 4px; color: var(--text); font-size: 13px; font-weight: 500; font-family: inherit; }
    .refresh-btn:active { opacity: 0.5; }
    .refresh-icon { font-size: 16px; line-height: 1; display: inline-block; }
    @keyframes spin-icon { to { transform: rotate(360deg); } }
    .refresh-icon.spinning { animation: spin-icon 0.8s linear infinite; }
    .last-pulled { font-size: 10px; color: var(--muted); }

    /* Progress */
    .progress-bar { height: 2px; background: rgba(0,0,0,0.06); border-radius: 2px; margin-bottom: 12px; flex-shrink: 0; }
    .progress-fill { height: 100%; background: var(--approve); border-radius: 2px; transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }

    /* Card area */
    .card-area { flex: 1; position: relative; min-height: 0; }
    .card-stack { position: absolute; top: 0; bottom: 0; left: 10px; right: 10px; }
    .card {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: 20px; overflow: hidden; display: flex; flex-direction: column;
      touch-action: none; will-change: transform; z-index: 2;
      box-shadow: 8px 8px 0 0 #ddd8ce, 14px 14px 0 0 #d0cbc0;
    }
    .card.animating { transition: transform 0.38s cubic-bezier(0.4,0,0.2,1), opacity 0.38s ease; }
    .card.fly-right { transform: translateX(110%) rotate(12deg) !important; opacity: 0; }
    .card.fly-left  { transform: translateX(-110%) rotate(-12deg) !important; opacity: 0; }
    .deck-card { position: absolute; background: var(--surface); border: 0.5px solid var(--border); border-radius: 20px; pointer-events: none; }
    .deck-card-2 { top: 10px; left: 8px; right: 8px; bottom: 0; opacity: 0.55; z-index: 1; }
    .deck-card-3 { top: 0; left: 16px; right: 16px; bottom: 0; opacity: 0.3; z-index: 0; }

    /* Video frame */
    .video-frame { flex: 1; min-height: 0; background: #ebebeb; position: relative; }
    .video-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-size: 13px; }
    .video-loading .spinner { width: 24px; height: 24px; border: 2px solid rgba(0,0,0,0.08); border-top-color: var(--approve); border-radius: 50%; animation: spin-icon 0.8s linear infinite; }
    .watch-link { color: #5DCAA5; font-size: 12px; text-decoration: none; padding: 6px 14px; border: 0.5px solid #5DCAA5; border-radius: 999px; margin-top: 6px; }

    /* Meta */
    .meta { padding: 12px 14px 16px; flex-shrink: 0; border-top: 0.5px solid var(--border); background: var(--surface); }
    .meta-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
    .meta-top-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .badge { font-size: 10px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: rgba(29,158,117,0.12); color: #1D9E75; white-space: nowrap; flex-shrink: 0; }
    .posted-date { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .comments-link { font-size: 12px; color: #5DCAA5; text-decoration: none; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
    .card-title { font-size: 13px; font-weight: 500; line-height: 1.5; color: var(--text); word-break: break-word; }
    .views { font-size: 11px; color: var(--muted); margin-top: 6px; }
    .screen-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
    .screen-topic { font-size: 11px; font-weight: 600; color: var(--text); }
    .screen-chip { font-size: 10px; color: var(--muted); border: 0.5px solid var(--muted); border-radius: 999px; padding: 2px 8px; }
    .screen-chip.listicle { color: #5DCAA5; border-color: #5DCAA5; }
    /* Real lines from the video — the thing that tells you if the idea is any good */
    .card-examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .card-examples span { font-size: 12px; color: var(--text); background: rgba(93,202,165,0.12);
      border-radius: 8px; padding: 4px 10px; }

    /* Why-skip sheet */
    .why-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 90; }
    .why-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 91; background: var(--surface);
      border-top-left-radius: 18px; border-top-right-radius: 18px; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
      box-shadow: 0 -8px 30px rgba(0,0,0,0.35); max-height: 85vh; overflow-y: auto; }
    .why-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
    .why-sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
    .why-opt { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px;
      border-radius: 12px; border: 0.5px solid var(--border); background: var(--bg); color: var(--text);
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .why-opt.sel { border-color: var(--approve); box-shadow: inset 0 0 0 1px var(--approve); }
    .why-opt small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); margin-top: 3px; }
    .why-input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 0.5px solid var(--border);
      background: var(--bg); color: var(--text); font-family: inherit; font-size: 13px; margin-top: 4px; }
    .why-recent { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .why-recent button { font-size: 11px; color: var(--muted); background: none; border: 0.5px solid var(--border);
      border-radius: 999px; padding: 5px 10px; font-family: inherit; cursor: pointer; }
    .why-actions { display: flex; gap: 8px; margin-top: 14px; }
    .why-actions button { flex: 1; padding: 13px; border-radius: 12px; font-family: inherit; font-size: 14px;
      font-weight: 600; cursor: pointer; }
    .why-cancel { border: 0.5px solid var(--border); background: var(--bg); color: var(--muted); }
    .why-go { border: none; background: var(--reject); color: #fff; }
    .why-go[disabled] { opacity: 0.4; }

    /* Stamps */
    .stamp { position: absolute; top: 28px; font-size: 28px; font-weight: 900; padding: 8px 16px; border-radius: 8px; opacity: 0; pointer-events: none; z-index: 10; letter-spacing: 3px; text-transform: uppercase; }
    .stamp.approve { left: 18px; color: #1D9E75; border: 4px solid #1D9E75; transform: rotate(-15deg); background: rgba(255,255,255,0.9); }
    .stamp.reject  { right: 18px; color: #E24B4A; border: 4px solid #E24B4A; transform: rotate(15deg); background: rgba(255,255,255,0.9); }
    .card-bg-overlay { position: absolute; inset: 0; border-radius: 20px; pointer-events: none; z-index: 1; opacity: 0; }

    /* Script card */
    .script-thumb { flex: 1; min-height: 0; background: #ebebeb; position: relative; overflow: hidden; }
    .script-source { padding: 8px 14px; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .script-source-label { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; }
    .script-source-handle { font-size: 11px; color: #1D9E75; font-weight: 600; }
    #s-swipe-zone { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .script-body { height: 42%; flex-shrink: 0; overflow-y: auto; padding: 0 0 16px; -webkit-overflow-scrolling: touch; border-top: 0.5px solid var(--border); }
    .script-section { padding: 12px 14px 0; }
    .script-label { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .script-text { font-size: 13px; line-height: 1.7; color: var(--text); word-break: break-word; }
    .script-divider { margin: 14px 14px; border: none; border-top: 1.5px dashed var(--border); }
    .script-katie { background: rgba(29,158,117,0.04); border-radius: 12px; padding: 12px; margin: 0 14px 16px; }
    .script-katie .script-label { color: #1D9E75; }

    /* Settings */
    .settings-screen { display: flex; flex-direction: column; flex: 1; min-height: 0; padding-top: 4px; }
    .settings-section-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .accounts-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; margin-bottom: 16px; }
    .account-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 12px 14px; }
    .account-info { flex: 1; min-width: 0; }
    .account-handle { font-size: 13px; font-weight: 600; color: var(--text); }
    .account-url { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .remove-btn { background: none; border: none; cursor: pointer; font-size: 20px; color: var(--muted); padding: 0; line-height: 1; flex-shrink: 0; }
    .remove-btn:active { color: var(--reject); }
    .add-row { display: flex; gap: 8px; margin-bottom: 16px; flex-shrink: 0; }
    .add-input { flex: 1; padding: 12px 14px; border: 0.5px solid var(--border); border-radius: 12px; font-size: 13px; font-family: inherit; background: var(--surface); color: var(--text); outline: none; }
    .add-input:focus { border-color: var(--approve); }
    .add-input::placeholder { color: var(--muted); }
    .add-btn { padding: 12px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; font-family: inherit; border: none; background: var(--approve); color: #fff; cursor: pointer; flex-shrink: 0; }
    .add-btn:active { opacity: 0.8; }
    .back-btn { width: 100%; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 600; font-family: inherit; border: 0.5px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; flex-shrink: 0; }

    /* Done / loading screens */
    .done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; padding: 2rem 1rem; overflow-y: auto; padding-top: max(2rem, 8vh); }
    .done .check { font-size: 48px; margin-bottom: 12px; }
    .done h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.4px; }
    .done > p { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    .pills { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    .pill { padding: 6px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; }
    .pill.a { background: var(--approve-bg); color: var(--approve); border: 0.5px solid var(--approve); }
    .pill.r { background: var(--reject-bg); color: var(--reject); border: 0.5px solid var(--reject); }
    .approved-list { width: 100%; border: 0.5px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 16px; text-align: left; max-height: 200px; overflow-y: auto; }
    .approved-item { padding: 11px 14px; border-bottom: 0.5px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .approved-item:last-child { border-bottom: none; }
    .approved-item .t { font-size: 13px; font-weight: 500; flex: 1; line-height: 1.3; }
    .approved-item .v { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .video-results { width: 100%; margin-bottom: 16px; text-align: left; display: flex; flex-direction: column; gap: 14px; }
    .video-result { border: 0.5px solid var(--border); border-radius: 14px; padding: 12px; }
    .video-result-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .video-result-head .t { font-size: 13px; font-weight: 500; }
    .btn-primary { width: 100%; padding: 15px; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; background: var(--approve); color: #fff; font-family: inherit; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { width: 100%; padding: 13px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; border: 0.5px solid var(--border); background: var(--surface); color: var(--text); margin-top: 10px; font-family: inherit; }
    .loading-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 2rem; }
    .loading-spinner { width: 36px; height: 36px; border: 3px solid rgba(0,0,0,0.08); border-top-color: var(--approve); border-radius: 50%; animation: spin-icon 0.8s linear infinite; }
    .loading-title { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
    .loading-sub { font-size: 13px; color: var(--muted); }

    /* Creator discovery */
    .creator-list { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding: 4px 0 16px; -webkit-overflow-scrolling: touch; }
    .creator-row { background: var(--surface); border: 0.5px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px; }
    .creator-row.starred { border-color: var(--approve); background: rgba(29,158,117,0.04); }
    .creator-main { flex: 1; min-width: 0; cursor: pointer; }

    /* Creator row: identity, then the shape of their posting, then the figures */
    .row-top { display: flex; align-items: center; gap: 10px; }
    .row-thumb { width: 34px; height: 44px; border-radius: 7px; object-fit: cover; background: #ebebeb; flex-shrink: 0; }
    .row-id { flex: 1; min-width: 0; }
    .row-handle { font-size: 13px; font-weight: 600; letter-spacing: -0.1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .row-score { text-align: right; flex-shrink: 0; line-height: 1.1; }
    .row-score-n { display: block; font-size: 20px; font-weight: 700; color: var(--approve); font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
    .row-score-l { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .row-score.none .row-score-n { color: var(--muted); opacity: 0.45; }

    /* Spark bars — height is the signal; the dashed rule is the breakout line */
    .spark { position: relative; height: 28px; margin: 10px 0 8px; }
    .spark-bars { display: flex; align-items: flex-end; gap: 2px; height: 100%; }
    .spark-bars span { flex: 1; background: #BDB7AB; border-radius: 1.5px; min-width: 2px; }
    .spark-bars span.hit { background: var(--approve); }
    .spark-rule { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed rgba(0,0,0,0.22); z-index: 1; }
    .spark-empty { font-size: 11px; color: var(--muted); margin: 10px 0 8px; opacity: 0.7; }

    .row-figs { display: flex; gap: 14px; font-size: 11px; color: var(--muted); }
    .row-figs b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

    /* A key instead of a paragraph — same information, one line, scannable */
    .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 10.5px; color: var(--muted); padding: 0 2px 10px; align-items: center; }
    .legend i { display: inline-block; width: 7px; height: 11px; border-radius: 1.5px; vertical-align: -1px; margin-right: 4px; }
    .legend .sw.hit { background: var(--approve); }
    .legend .sw.bar { background: #BDB7AB; }

    .blank { text-align: center; padding: 34px 20px; font-size: 13px; color: var(--muted); line-height: 1.6; }
    .blank-icon { font-size: 30px; margin-bottom: 10px; opacity: 0.55; }
    .list-foot { text-align: center; font-size: 10.5px; color: var(--muted); padding: 4px 0; opacity: 0.8; }

    /* Shortlist card — the thumbnail leads, since you judge a format by looking */
    .vid-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 14px; padding: 10px; display: flex; gap: 11px; cursor: pointer; }
    .vid-card:active { opacity: 0.7; }
    .vid-thumb-wrap { position: relative; flex-shrink: 0; }
    .vid-thumb-lg { width: 62px; height: 82px; border-radius: 9px; object-fit: cover; background: #ebebeb; display: block; }
    .vid-mult { position: absolute; left: 4px; bottom: 4px; background: var(--approve); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 999px; font-variant-numeric: tabular-nums; }
    .vid-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
    .vid-body .vid-caption { -webkit-line-clamp: 3; }
    .vid-body .vid-meta { margin-top: 0; }
    .vid-body .vid-meta b { color: var(--text); font-weight: 600; }
    .creator-handle { font-size: 13px; font-weight: 600; letter-spacing: -0.1px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .creator-stats { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
    .creator-bio { font-size: 11px; color: var(--muted); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.8; }
    .star-btn { background: none; border: none; cursor: pointer; font-size: 18px; line-height: 1; padding: 2px; flex-shrink: 0; opacity: 0.3; }
    .star-btn.on { opacity: 1; }
    .tag { font-size: 9px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
    .tag.tutorial { background: rgba(29,158,117,0.12); color: #1D9E75; }
    .tag.emotional { background: rgba(186,117,23,0.14); color: #96601a; }
    .tag.mixed, .tag.unknown { background: rgba(0,0,0,0.06); color: var(--muted); }
    .tag.hot { background: rgba(226,75,74,0.12); color: #c23b3a; }
    .tag.cam-talking_head { background: rgba(55,138,221,0.14); color: #2a6cb0; }
    .tag.cam-faceless { background: rgba(0,0,0,0.06); color: var(--muted); }
    .tag.cam-mixed { background: rgba(126,102,196,0.14); color: #5c47a0; }
    .tag.cam-unclear { background: rgba(0,0,0,0.04); color: var(--muted); }
    .tag.skit { background: rgba(186,117,23,0.14); color: #96601a; }
    .tag.repeat { background: rgba(29,158,117,0.14); color: #1D9E75; }
    .tag.mine { background: rgba(55,138,221,0.13); color: #2a6cb0; margin-left: 6px; font-size: 8.5px; padding: 2px 6px; vertical-align: 1px; }
    .metric { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text); }
    .vid-row { display: flex; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid var(--border); align-items: flex-start; }
    .vid-row:last-child { border-bottom: none; }
    .vid-thumb { width: 46px; height: 62px; border-radius: 7px; object-fit: cover; background: #ebebeb; flex-shrink: 0; }
    .vid-info { flex: 1; min-width: 0; }
    .vid-caption { font-size: 12px; line-height: 1.45; color: var(--text); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .vid-meta { font-size: 10px; color: var(--muted); margin-top: 4px; }
    .kw-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .kw-chip { background: var(--surface); border: 0.5px solid var(--border); border-radius: 999px; padding: 6px 10px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
    .kw-chip button { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 15px; line-height: 1; padding: 0; }
    .run-steps { display: flex; flex-direction: column; gap: 9px; margin-top: 8px; text-align: left; align-self: center; }
    .run-step { font-size: 12.5px; color: var(--muted); opacity: 0.45; display: flex; align-items: center; gap: 9px; white-space: nowrap; }
    .run-step i { font-style: normal; width: 16px; height: 16px; border-radius: 50%; background: rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; flex-shrink: 0; }
    .run-step.step-now { opacity: 1; color: var(--text); font-weight: 600; }
    .run-step.step-now i { background: var(--approve); color: #fff; }
    .run-step.step-done { opacity: 1; color: var(--approve); }
    .run-step.step-done i { background: var(--approve-bg); color: var(--approve); }
    .run-note { font-size: 11px; color: var(--muted); max-width: 250px; margin-top: 2px; }

    /* Home screen */
    .home-screen { flex: 1; display: flex; flex-direction: column; gap: 10px; padding-top: 4px; overflow-y: auto; }
    .stage-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: opacity 0.1s; }
    .stage-card:active { opacity: 0.7; }
    .stage-card.disabled { opacity: 0.4; cursor: not-allowed; }
    .stage-card.primary { border-color: var(--approve); background: rgba(29,158,117,0.05); }
    .stage-icon { font-size: 28px; flex-shrink: 0; width: 44px; text-align: center; }
    .stage-info { flex: 1; min-width: 0; }
    .stage-title { font-size: 14px; font-weight: 600; letter-spacing: -0.2px; margin-bottom: 3px; }
    .stage-meta { font-size: 11px; color: var(--muted); }
    .stage-arrow { font-size: 16px; color: var(--muted); flex-shrink: 0; }
    /* The count replaces the chevron: it says both "there's something here" and how much */
    .stage-num { flex-shrink: 0; text-align: right; font-size: 22px; font-weight: 700; color: var(--approve); line-height: 1; letter-spacing: -0.6px; font-variant-numeric: tabular-nums; }
    .stage-num small { display: block; font-size: 9px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 3px; }
    .stage-num.muted { color: var(--muted); opacity: 0.6; }
    .stage-run { flex-shrink: 0; background: var(--approve); color: #fff; font-size: 12px; font-weight: 700; padding: 7px 15px; border-radius: 999px; letter-spacing: -0.1px; }
    .stage-badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
    .stage-badge.ready { background: var(--approve-bg); color: var(--approve); }
    .stage-badge.empty { background: rgba(0,0,0,0.06); color: var(--muted); }
  </style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ── State ──────────────────────────────────────────────────────
const APP_VERSION = 'v60';
let formats = [];
let current = 0;
const approved = [], rejected = [];
let startX = 0, startY = 0, isDragging = false, dragX = 0;

// Creators Ashitha has vetted by hand. The app no longer judges whether a
// creator is worth following — only whether a given video is worth remaking.
const DEFAULT_ACCOUNTS = [
  'https://www.tiktok.com/@wordy.adri',
  'https://www.tiktok.com/@learnwithmeera'
];

// ── Accounts ──────────────────────────────────────────────────
function loadAccounts() {
  try { const a = localStorage.getItem('kf_accounts'); if (a) return JSON.parse(a); } catch(e) {}
  return [...DEFAULT_ACCOUNTS];
}
function saveAccounts(a) { localStorage.setItem('kf_accounts', JSON.stringify(a)); }
function normaliseUrl(input) {
  input = input.trim();
  if (input.startsWith('https://www.tiktok.com/')) return input;
  if (input.startsWith('@')) return 'https://www.tiktok.com/' + input;
  if (input.includes('tiktok.com/')) return 'https://' + input.replace(/^https?:\/\//, '');
  return 'https://www.tiktok.com/@' + input.replace(/^@/, '');
}
function handleFromUrl(url) { const m = url.match(/@([^/?]+)/); return m ? '@' + m[1] : url; }

// ── The latest run ─────────────────────────────────────────────
// The Mac does the pulling and screening now (scripts/screen_run.py) and
// publishes one JSON document to the sheet. The app reads it. Nothing here
// starts work — there is no refresh button any more, on purpose.
let latestRun = null;

function saveRunCache(doc) {
  try { localStorage.setItem('kf_run', JSON.stringify(doc)); } catch (e) {}
}
function loadRunCache() {
  try { return JSON.parse(localStorage.getItem('kf_run') || 'null'); } catch (e) { return null; }
}

// Shows the cached run straight away and refreshes behind it, so opening the
// app on a bad connection still shows last night's videos rather than a
// spinner.
async function fetchRun() {
  try {
    const res = await fetch('/api/sheets?action=getrun');
    const d = await res.json();
    if (d.ok && d.data) { latestRun = d.data; saveRunCache(d.data); }
  } catch (e) {}
  return latestRun;
}

function runAgeLabel(iso) {
  if (!iso) return '';
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 2) return 'just now';
  if (mins < 60) return `${mins} min ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs} hour${hrs === 1 ? '' : 's'} ago`;
  const days = Math.floor(hrs / 24);
  return `${days} day${days === 1 ? '' : 's'} ago`;
}

// ── Review progress ────────────────────────────────────────────
// Saved after every single swipe, not at the end. Reviewing 150 videos in one
// sitting is not realistic, and the first version only wrote anything once the
// last card was gone — so closing the tab sixty in threw away all sixty.
//
// Tied to the run's timestamp: a new run means new videos, and resuming into
// position 61 of a different list would be worse than starting over.
function saveProgress() {
  try {
    localStorage.setItem('kf_progress', JSON.stringify({
      runAt: latestRun?.at || '', current, approved, rejected
    }));
  } catch (e) {}
}

function loadProgress() {
  try {
    const p = JSON.parse(localStorage.getItem('kf_progress') || 'null');
    if (p && p.runAt === (latestRun?.at || '')) return p;
  } catch (e) {}
  return null;
}

function clearProgress() { localStorage.removeItem('kf_progress'); }

function formatPulledDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}
function formatPosted(iso) {
  if (!iso) return null;
  const d = new Date(iso); if (isNaN(d)) return null;
  const diff = Math.floor((Date.now() - d) / 86400000);
  if (diff === 0) return 'Today'; if (diff === 1) return 'Yesterday';
  if (diff < 7) return diff + 'd ago';
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

// ── Header ─────────────────────────────────────────────────────
function lastPulledLabel(pulledAt) {
  return pulledAt ? 'Last pulled: ' + formatPulledDate(pulledAt) : 'Never pulled';
}

function headerHTML(pulledAt, countText, showHomeBtn=true, title='Format review') {
  return `
    <div class="header">
      <div class="header-left">
        ${showHomeBtn ? `<button onclick="showHome()" style="background:none;border:none;cursor:pointer;padding:0 0 3px 0;font-size:12px;color:var(--muted);font-family:inherit;display:block;">← Home</button>` : ''}
        <h1>${title}</h1>
        ${countText ? `<div class="total-count" id="total-count">${countText}</div>` : ''}
      </div>
      <div class="header-right">
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="icon-btn" onclick="showSettings()">⚙️</button>
        </div>
        <span class="last-pulled" id="last-pulled">${lastPulledLabel(pulledAt)}</span>
      </div>
    </div>`;
}

// ── Stage 1: Format card UI ────────────────────────────────────
function showCardUI(pulledAt, resume) {
  if (!resume) { current = 0; approved.length = 0; rejected.length = 0; }
  document.getElementById('app').innerHTML = `
    ${headerHTML(pulledAt, formats.length + ' videos to review' + (latestRun?.counts?.dropped ? ` · ${latestRun.counts.dropped} filtered out` : ''), true, 'Format review')}
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:${100/formats.length}%"></div></div>
    <div class="card-area">
      <div class="card-stack">
        <div class="deck-card deck-card-3"></div>
        <div class="deck-card deck-card-2"></div>
        <div class="card" id="card">
          <div class="stamp approve" id="stamp-a">APPROVE</div>
          <div class="stamp reject" id="stamp-r">SKIP</div>
          <div class="card-bg-overlay" id="bg-overlay"></div>
          <div class="video-frame" id="video-frame"><div class="video-loading"><div class="spinner"></div><span>Loading...</span></div></div>
          <div class="meta" id="meta"></div>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:12px;padding:12px 10px 0;flex-shrink:0;">
      <button onclick="swipe('left')" style="flex:1;padding:14px;border-radius:14px;font-size:14px;font-weight:600;border:0.5px solid var(--border);background:var(--surface);color:var(--reject);cursor:pointer;font-family:inherit;">✕ Skip</button>
      <button onclick="swipe('right')" style="flex:1;padding:14px;border-radius:14px;font-size:14px;font-weight:600;border:none;background:var(--approve);color:#fff;cursor:pointer;font-family:inherit;">✓ Approve</button>
    </div>
    <div style="text-align:center;padding:10px 0 0;flex-shrink:0;">
      <button id="undo-btn" onclick="undoLast()" style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;">↩ Undo last</button>
    </div>`;
  attachTouchEvents();
  document.onkeydown = (e) => { if (e.key === 'ArrowRight') swipe('right'); else if (e.key === 'ArrowLeft') swipe('left'); };
  loadCard(current);
  updateUndo();
}

// ── Undo ───────────────────────────────────────────────────────
// A thumb slips, and without this the only way back was to start the whole
// batch again. Steps back one card and takes it out of whichever list it
// landed in.
function undoLast() {
  if (current === 0) return;
  current--;
  const v = formats[current];
  for (const list of [approved, rejected]) {
    const i = list.findIndex(x => x.url === v.url);
    if (i > -1) list.splice(i, 1);
  }
  saveProgress();
  loadCard(current);
  updateUndo();
}

function updateUndo() {
  const b = document.getElementById('undo-btn');
  if (b) { b.disabled = current === 0; b.style.opacity = current === 0 ? 0.3 : 1; }
}

// The run doc carries raw counts — the formatting used to happen during the
// pull, which no longer exists here.
function fmtNum(n) {
  n = Number(n) || 0;
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return Math.round(n / 1000) + 'K';
  return String(n);
}

async function loadCard(idx) {
  const vf = document.getElementById('video-frame');
  const meta = document.getElementById('meta');
  const prog = document.getElementById('progress');
  const tc = document.getElementById('total-count');
  const f = formats[idx];
  if (prog) prog.style.width = `${((idx+1)/formats.length)*100}%`;
  if (tc) tc.textContent = `${idx+1} / ${formats.length} videos`;
  vf.innerHTML = '<div class="video-loading"><div class="spinner"></div><span>Loading...</span></div>';
  const posted = formatPosted(f.created);
  const views = fmtNum(f.views), comments = fmtNum(f.comments);
  meta.innerHTML = `
    <div class="meta-top">
      <div class="meta-top-left">
        <span class="badge">@${f.author || 'tiktok'}</span>
        ${posted ? `<span class="posted-date">${posted}</span>` : ''}
      </div>
      <a class="comments-link" href="${f.url}" target="_blank">💬 Comments</a>
    </div>
    <div class="card-title">${f.title}</div>
    <div class="views">♥ ${views} likes &nbsp;·&nbsp; 💬 ${comments} comments${
      f.outlierRatio > 1 ? ` &nbsp;·&nbsp; ${f.outlierRatio}× their normal` : ''}</div>
    ${(f.examples || []).length ? `<div class="card-examples">${
      f.examples.slice(0, 3).map(e => `<span>${e}</span>`).join('')}</div>` : ''}
    ${f.topic ? `<div class="screen-tags">
      <span class="screen-topic">${f.topic}</span>
      ${f.contentType ? `<span class="screen-chip">${f.contentType}</span>` : ''}
      ${f.makeListicle ? `<span class="screen-chip listicle">make it a listicle</span>` : ''}
    </div>` : ''}`;
  if (f.thumbnail) showThumb(vf, f.thumbnail, f.url);
  else {
    try {
      const res = await fetch(`/api/oembed?url=${encodeURIComponent(f.url)}`);
      const data = await res.json();
      if (data.thumbnail_url) showThumb(vf, data.thumbnail_url, f.url);
      else showFallback(vf, f.url);
    } catch { showFallback(vf, f.url); }
  }
}

function showThumb(vf, thumb, url) {
  vf.innerHTML = `
    <a href="${url}" target="_blank" style="display:block;width:100%;height:100%;position:relative;text-decoration:none;">
      <img src="${thumb}" style="width:100%;height:100%;object-fit:cover;display:block;" />
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,0.35);">
        <div style="width:56px;height:56px;background:rgba(255,255,255,0.95);border-radius:50%;display:flex;align-items:center;justify-content:center;">
          <div style="width:0;height:0;border-style:solid;border-width:10px 0 10px 20px;border-color:transparent transparent transparent #000;margin-left:4px;"></div>
        </div>
        <span style="color:#fff;font-size:13px;font-weight:600;background:rgba(0,0,0,0.5);padding:5px 14px;border-radius:999px;">Watch on TikTok</span>
      </div>
    </a>`;
}
function showFallback(vf, url) {
  vf.innerHTML = `<div class="video-loading"><span>Preview unavailable</span><a class="watch-link" href="${url}" target="_blank">Watch on TikTok →</a></div>`;
}

// ── Why-skip ───────────────────────────────────────────────────
// A rejection is only useful later if we know which kind it was. Three kinds,
// and they mean opposite things: a new standing rule, the screener getting
// this one wrong, or a one-off with no lesson in it. Lumped together they
// cancel each other out — the engine that reads these is task #6.
const WHY_KINDS = [
  { id: 'rule',       label: 'Never show me these again',
    hint: 'A standing rule — the whole kind of video is wrong for us' },
  { id: 'correction', label: 'The filter got this one wrong',
    hint: 'It should have caught this — a skit, a repeat, British English' },
  { id: 'oneoff',     label: 'Just this one',
    hint: 'Nothing to learn from — fine idea, wrong video' }
];

let whyPick = null;

function loadRecentReasons() {
  try { return JSON.parse(localStorage.getItem('kf_recent_reasons') || '[]'); } catch(e) { return []; }
}
// Typing on a phone is friction, and friction is what kills feedback loops.
// Reasons already used come back as one-tap chips, newest first.
function rememberReason(text) {
  if (!text) return;
  const list = [text, ...loadRecentReasons().filter(r => r !== text)].slice(0, 8);
  localStorage.setItem('kf_recent_reasons', JSON.stringify(list));
}

function openWhySheet() {
  whyPick = null;
  const recent = loadRecentReasons();
  const el = document.createElement('div');
  el.id = 'why-wrap';
  el.innerHTML = `
    <div class="why-backdrop" onclick="closeWhySheet()"></div>
    <div class="why-sheet">
      <div class="why-title">Why skip it?</div>
      <div class="why-sub">${formats[current]?.topic || formats[current]?.title?.slice(0, 60) || ''}</div>
      ${WHY_KINDS.map(k => `
        <button class="why-opt" id="why-${k.id}" onclick="pickWhy('${k.id}')">
          ${k.label}<small>${k.hint}</small>
        </button>`).join('')}
      <input class="why-input" id="why-text" type="text" placeholder="In your words (optional)" />
      ${recent.length ? `<div class="why-recent">${recent.map(r =>
        `<button onclick="useReason(this.textContent)">${r}</button>`).join('')}</div>` : ''}
      <div class="why-actions">
        <button class="why-cancel" onclick="closeWhySheet()">Cancel</button>
        <button class="why-go" id="why-go" disabled onclick="confirmWhy()">Skip it</button>
      </div>
    </div>`;
  document.body.appendChild(el);
}

function pickWhy(id) {
  whyPick = id;
  WHY_KINDS.forEach(k => document.getElementById('why-' + k.id)?.classList.toggle('sel', k.id === id));
  const go = document.getElementById('why-go');
  if (go) go.disabled = false;
}

function useReason(text) {
  const input = document.getElementById('why-text');
  if (input) input.value = text;
}

function closeWhySheet() {
  document.getElementById('why-wrap')?.remove();
  // The card was dragged part-way off before the sheet opened — put it back.
  const card = document.getElementById('card');
  if (card) card.style.transform = '';
  ['stamp-a','stamp-r','bg-overlay'].forEach(id => {
    const el = document.getElementById(id); if (el) el.style.opacity = 0;
  });
}

function confirmWhy() {
  const reason = document.getElementById('why-text')?.value.trim() || '';
  const kind = whyPick;
  rememberReason(reason);
  document.getElementById('why-wrap')?.remove();
  doSwipe('left', { kind, reason });
}

// ── Stage 1: Swipe ─────────────────────────────────────────────
// Rejecting asks why first; approving doesn't. An approval carries no
// information beyond itself, and stopping to explain every yes would make
// swiping through sixty videos unbearable.
function swipe(dir) {
  if (current >= formats.length) return;
  if (dir === 'left') { openWhySheet(); return; }
  doSwipe(dir, null);
}

function doSwipe(dir, why) {
  if (current >= formats.length) return;
  const card = document.getElementById('card');
  // A drag leaves an inline transform behind, and inline beats the class the
  // fly-away animation uses. Clear it or the card just sits there.
  card.style.transform = '';
  card.classList.add('animating', dir === 'right' ? 'fly-right' : 'fly-left');
  if (dir === 'right') approved.push(formats[current]);
  else rejected.push({ ...formats[current], whyKind: why?.kind || '', whyReason: why?.reason || '' });
  current++;
  // Before the animation, not after — a tab closed mid-flight still counts.
  saveProgress();
  saveApprovedFormats(approved);
  setTimeout(() => {
    card.classList.remove('animating','fly-right','fly-left');
    card.style.transform = '';
    ['stamp-a','stamp-r','bg-overlay'].forEach(id => { const el = document.getElementById(id); if (el) el.style.opacity = 0; });
    if (current >= formats.length) showStage1Done();
    else { loadCard(current); updateUndo(); }
  }, 400);
}

// Send the whole session's swipes to the Decisions tab. Fire and forget: a
// failed log must never block the review, but it is retried once, because a
// lost rejection is a lesson gone for good.
//
// Reviewing the same batch again appends a second row rather than replacing
// the first. Changing your mind is itself worth knowing about, so whoever
// reads this later takes the newest row per video and keeps the rest.
// With no argument, logs the whole session. With one, logs just those rows —
// used when a single skip is put back, so a correction does not re-append all
// hundred and fifty.
async function logDecisions(explicitRows) {
  const rows = (explicitRows || [
    ...approved.map(f => ({ ...f, swipe: 'approve' })),
    ...rejected.map(f => ({ ...f, swipe: 'reject' }))
  ]).map(f => ({
    url: f.url, author: f.author, topic: f.topic || '', contentType: f.contentType || '',
    screenerVerdict: 'keep', screenerReasons: '',
    swipe: f.swipe, whyKind: f.whyKind || '', whyReason: f.whyReason || ''
  }));
  if (!rows.length) return;

  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const res = await fetch('/api/sheets', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'decisions', rows })
      });
      const data = await res.json();
      if (data.ok) { localStorage.removeItem('kf_unlogged'); return; }
    } catch (e) {}
  }
  // Out of retries — keep them on the phone so nothing is silently lost.
  localStorage.setItem('kf_unlogged', JSON.stringify(rows));
}

// ── Stage 1: Done ──────────────────────────────────────────────
function showStage1Done(skipLog) {
  if (!skipLog) logDecisions();
  const pulled = localStorage.getItem('kf_pulled');
  document.getElementById('app').innerHTML = `
    ${headerHTML(pulled, null, true, 'Format review')}
    <div class="done">
      <div class="check">✓</div>
      <h2>Formats reviewed</h2>
      <p>${approved.length} approved · ${rejected.length} skipped</p>
      ${rejected.length ? `
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">Skipped — tap one to put it back</div>
        <div class="approved-list" style="margin-bottom:14px;">
          ${rejected.map((r, i) => `
            <div class="approved-item" style="cursor:pointer;" onclick="restoreSkipped(${i})">
              <span class="t">${r.whyReason || r.topic || r.title}</span>
              <span class="v">↩ put back</span>
            </div>`).join('')}
        </div>` : ''}
      ${approved.length > 0 ? `
        <div class="approved-list">
          ${approved.map(f => `<div class="approved-item"><span class="t">${f.title}</span><span class="v">♥ ${f.views}</span></div>`).join('')}
        </div>
      ` : '<p style="color:var(--muted);font-size:14px;margin-bottom:16px;">No formats approved.</p>'}
      <button class="btn-secondary" onclick="reviewFormatsAgain()">Review again</button>
      <button class="btn-secondary" onclick="showHome()">← Home</button>
    </div>`;
}
// Move one back out of the skipped list. The sheet already has it logged as a
// reject, so the correction is logged too — the Decisions tab is append-only
// and whoever reads it takes the newest row per video.
function restoreSkipped(i) {
  const v = rejected.splice(i, 1)[0];
  if (!v) return;
  delete v.whyKind; delete v.whyReason;
  approved.push(v);
  saveApprovedFormats(approved);
  saveProgress();
  logDecisions([{ ...v, swipe: 'approve' }]);
  showStage1Done(true);
}

function reviewFormatsAgain() {
  approved.length = 0; rejected.length = 0;
  saveApprovedFormats([]);
  clearProgress();
  ['kf_generated_scripts','kf_generated_scripts_date','kf_approved_scripts','kf_approved_scripts_date','kf_generated_videos','kf_generated_videos_date'].forEach(k=>localStorage.removeItem(k));
  current = 0;
  showCardUI(latestRun?.at);
}

// Stages 2 and 3 — writing the Katie script and generating the video via
// Omni — used to live here. They are a separate skill now, so the app stops
// at the approved list. The Decisions tab in the sheet is the handover.

// ── Settings ───────────────────────────────────────────────────
function showSettings() {
  const pulled = localStorage.getItem('kf_pulled');
  document.getElementById('app').innerHTML = `
    ${headerHTML(pulled, null, true, 'Settings')}
    <div class="settings-screen">
      <div style="flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;">
        <div class="settings-section-title">Discovery keywords</div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.5;">
          Used to find creators you don't already follow. Searched as both a
          keyword and a hashtag.
        </div>
        <div class="kw-chips" id="kw-chips"></div>
        <div class="add-row">
          <input class="add-input" id="kw-input" type="text" placeholder="e.g. english pronunciation" />
          <button class="add-btn" onclick="addKeyword()">Add</button>
        </div>

        <div class="settings-section-title" style="margin-top:8px;">Tracked accounts</div>

// Screening used to happen here, in the browser, one Claude call per video
// against the paid API. It runs on the Mac now — scripts/screen_run.py — and
// the app only reads the run it publishes. See fetchRun() above.

// ── Stage 1 touch events ───────────────────────────────────────
function attachTouchEvents() {
  const card = document.getElementById('card');
  if (!card) return;
  card.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; isDragging = true; dragX = 0; }, { passive: true });
  card.addEventListener('touchmove', e => {
    if (!isDragging) return;
    dragX = e.touches[0].clientX - startX;
    const dragY = e.touches[0].clientY - startY;
    if (Math.abs(dragX) < Math.abs(dragY) && Math.abs(dragX) < 10) return;
    card.style.transform = `translateX(${dragX}px) rotate(${dragX * 0.06}deg)`;
    const progress = Math.abs(dragX) > 30 ? Math.min((Math.abs(dragX) - 30) / 70, 1) : 0;
    const sa = document.getElementById('stamp-a'); const sr = document.getElementById('stamp-r'); const ov = document.getElementById('bg-overlay');
    if (sa) sa.style.opacity = dragX > 30 ? progress : 0;
    if (sr) sr.style.opacity = dragX < -30 ? progress : 0;
    if (ov) { ov.style.background = dragX > 30 ? 'rgba(29,158,117,0.15)' : dragX < -30 ? 'rgba(226,75,74,0.15)' : 'transparent'; ov.style.opacity = progress; }
  }, { passive: true });
  card.addEventListener('touchend', () => {
    if (!isDragging) return; isDragging = false;
    if (dragX > 80) swipe('right');
    else if (dragX < -80) swipe('left');
    else { card.style.transform = ''; ['stamp-a','stamp-r','bg-overlay'].forEach(id => { const el = document.getElementById(id); if (el) el.style.opacity = 0; }); }
  });
}

// ══════════════════════════════════════════════════════════════════
//  CREATOR DISCOVERY
//
//  Finds English-teaching creators worth copying, ranked by outliers,
//  instead of reviewing one video at a time. Two phases:
//    1. Discover  — sweep keywords/hashtags for candidate handles
//    2. Deep scan — pull ~24 videos per handle for real per-creator maths
//  Phase 2 is the one that matters: you can only call a video an outlier
//  once you know what that account's normal looks like.
// ══════════════════════════════════════════════════════════════════

const DEFAULT_KEYWORDS = [
  'english tips', 'learn english', 'english grammar', 'english pronunciation',
  'speak english fluently', 'english mistakes', 'phrasal verbs', 'english vocabulary'
];

function loadKeywords() {
  try { const k = localStorage.getItem('kf_keywords'); if (k) return JSON.parse(k); } catch(e) {}
  return [...DEFAULT_KEYWORDS];
}
function saveKeywords(k) { localStorage.setItem('kf_keywords', JSON.stringify(k)); }

function loadCandidates() {
  try { const c = localStorage.getItem('kf_candidates'); if (c) return JSON.parse(c); } catch(e) {}
  return null;
}
function saveCandidates(c) {
  localStorage.setItem('kf_candidates', JSON.stringify(c));
  localStorage.setItem('kf_candidates_date', new Date().toISOString());
}

// Creators are merged across scans and kept, so a handle scanned last week
// still shows up alongside today's. Nothing is thrown away on a new sweep.
function loadCreators() {
  try { const c = localStorage.getItem('kf_creators'); if (c) return JSON.parse(c); } catch(e) {}
  return [];
}
function saveCreators(incoming) {
  const existing = loadCreators();
  const byHandle = {};
  existing.forEach(c => { byHandle[c.handle] = c; });
  incoming.forEach(c => { byHandle[c.handle] = { ...c, scannedAt: new Date().toISOString() }; });
  const merged = Object.values(byHandle);
  localStorage.setItem('kf_creators', JSON.stringify(merged));
  localStorage.setItem('kf_creators_date', new Date().toISOString());
  return merged;
}

function loadStarred() {
  try { const s = localStorage.getItem('kf_starred_creators'); if (s) return JSON.parse(s); } catch(e) {}
  return [];
}
function saveStarred(s) { localStorage.setItem('kf_starred_creators', JSON.stringify(s)); }
function isStarred(handle) { return loadStarred().includes(handle); }
function toggleStar(handle, rerender) {
  const s = loadStarred();
  const i = s.indexOf(handle);
  if (i >= 0) s.splice(i, 1); else s.push(handle);
  saveStarred(s);
  if (rerender) rerender();
}

function fmtNum(n) {
  n = Number(n) || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + 'K';
  return String(n);
}

// One long run, so the screen says which of the three stages is going and
// roughly how far in you are.
const RUN_STEPS = ['Searching', 'Checking numbers', 'Watching videos'];

function showDiscoverLoading(title, sub, step = 1) {
  document.getElementById('app').innerHTML = `
    ${headerHTML(localStorage.getItem('kf_pulled'), null, true, 'Finding creators')}
    <div class="loading-screen">
      <div class="loading-spinner"></div>
      <div>
        <div class="loading-title" id="loading-title">${title}</div>
        <div class="loading-sub" id="loading-sub">${sub || ''}</div>
      </div>
      <div class="run-steps">
        ${RUN_STEPS.map((s, i) => {
          const state = i + 1 < step ? 'step-done' : i + 1 === step ? 'step-now' : '';
          const mark = i + 1 < step ? '✓' : i + 1 === step ? '●' : i + 1;
          return `<div class="run-step ${state}"><i>${mark}</i>${s}</div>`;
        }).join('')}
      </div>
      <div class="run-note">Takes a few minutes — keep this screen open</div>
    </div>`;
}
function setDiscoverStatus(title, sub) {
  const t = document.getElementById('loading-title');
  const s = document.getElementById('loading-sub');
  if (t && title) t.textContent = title;
  if (s && sub != null) s.textContent = sub;
}

// Turns Apify's refusal into something you can act on. A spent quota and a bad
// token both surface as "couldn't start the run", and they need opposite fixes.
function apifyReason(data) {
  const msg = data.error || 'Apify would not start the run';
  if (/usage hard limit|monthly usage|limit exceeded/i.test(msg)) {
    return 'Apify has hit its monthly usage limit, so it will not start a scrape.\n\n' +
           'Open console.apify.com → Billing and either raise the spend cap or ' +
           'wait for the reset date shown there. Nothing in the app needs fixing.';
  }
  if (/token|unauthor|forbidden/i.test(msg)) {
    return 'Apify rejected the API token. Check APIFY_TOKEN in the Vercel project settings.';
  }
  return msg;
}

// Polls an Apify run until it finishes, then returns its datasetId.
async function waitForRun(runId, label) {
  for (let attempt = 1; attempt <= 90; attempt++) {
    await new Promise(r => setTimeout(r, 5000));
    const res = await fetch(`/api/apify?action=status&runId=${runId}`);
    const data = await res.json();
    const found = data.itemCount != null ? ` · ${data.itemCount} videos so far` : '';
    setDiscoverStatus(null, `${label} — ${attempt * 5}s${found}`);
    if (data.status === 'SUCCEEDED' && data.datasetId) return data.datasetId;
    if (['FAILED', 'ABORTED', 'TIMED-OUT'].includes(data.status)) {
      throw new Error('Apify run ' + data.status);
    }
  }
  throw new Error('Scrape timed out after 7.5 minutes');
}

// ── Phase 1: keyword sweep ────────────────────────────────────────
async function startDiscovery() {
  const keywords = loadKeywords();
  if (!keywords.length) { alert('Add some keywords in ⚙️ Settings first.'); return; }
  showDiscoverLoading('Searching TikTok…', `${keywords.length} keywords`, 1);
  try {
    const res = await fetch('/api/apify?action=discover', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ keywords, perKeyword: 40 })
    });
    const data = await res.json();
    if (!data.runId) throw new Error(apifyReason(data));
    const datasetId = await waitForRun(data.runId, 'Sweeping');
    setDiscoverStatus('Grouping by creator…', '');
    const cRes = await fetch(`/api/apify?action=candidates&datasetId=${datasetId}`);
    const cData = await cRes.json();
    if (!cData.candidates) throw new Error(cData.error || 'No candidates returned');
    saveCandidates(cData.candidates);

    // Straight on to the deep scan — the candidate list has nothing worth
    // deciding on, so stopping here would just be a button to press.
    const handles = pickForDeepScan(cData.candidates);
    if (!handles.length) {
      alert('The sweep found no tutorial-style creators. Try different keywords in ⚙️ Settings.');
      return showHome();
    }
    await deepScan(handles);
  } catch (err) {
    alert('Discovery failed: ' + err.message);
    showHome();
  }
}

// Who gets the expensive 24-post scan. Tutorial-style first — that's the track
// being automated — with unknowns filling the rest. Scans more than you'd
// think it needs because the talking-head filter later removes most of them.
function pickForDeepScan(candidates) {
  return [
    ...candidates.filter(c => c.style === 'tutorial'),
    ...candidates.filter(c => c.style === 'unknown')
  ].slice(0, 24).map(c => c.handle);
}

function showCandidates() {
  const candidates = loadCandidates() || [];
  const tutorial = candidates.filter(c => c.style === 'tutorial');
  document.getElementById('app').innerHTML = `
    ${headerHTML(localStorage.getItem('kf_pulled'), `${candidates.length} creators found · ${tutorial.length} look tutorial-style`, true, 'Candidates')}
    <div style="font-size:11px;color:var(--muted);padding:0 0 10px;line-height:1.5;">
      From the keyword sweep. Views here are just the one video that surfaced —
      deep scan to get each creator's real numbers.
    </div>
    <div class="creator-list">
      ${candidates.length === 0 ? `<p style="font-size:13px;color:var(--muted);text-align:center;padding:20px;">Nothing found. Try different keywords.</p>` : ''}
      ${candidates.map(c => `
        <div class="creator-row">
          <div class="creator-main" onclick="window.open('https://www.tiktok.com/@${c.handle}','_blank')">
            <div class="creator-handle">
              @${c.handle}
              <span class="tag ${c.style}">${c.style}</span>
              ${c.verified ? '<span class="tag mixed">verified</span>' : ''}
            </div>
            <div class="creator-stats">
              <span class="metric">${fmtNum(c.followers)}</span> followers ·
              best seen <span class="metric">${fmtNum(c.bestViews)}</span> views ·
              hit ${c.hits}× on your keywords
            </div>
          </div>
        </div>`).join('')}
    </div>
    <button class="btn-primary" onclick="deepScanCandidates()">Deep scan top 20 tutorial creators →</button>
    <button class="btn-secondary" onclick="showHome()">← Home</button>`;
}

// ── Phase 2: deep scan for real per-creator numbers ───────────────
async function deepScanCandidates() {
  const handles = pickForDeepScan(loadCandidates() || []);
  if (!handles.length) { alert('No tutorial-style candidates to scan.'); return; }
  await deepScan(handles);
}

async function deepScan(handles, opts = {}) {
  const mine = !!opts.mine;
  showDiscoverLoading(
    mine ? `Checking @${handles[0]}…` : 'Checking their numbers…',
    mine ? 'reading their last 24 posts' : `${handles.length} creators, ~24 posts each`, 2);
  try {
    const res = await fetch('/api/apify?action=profiles', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ handles, perProfile: 24 })
    });
    const data = await res.json();
    if (!data.runId) throw new Error(apifyReason(data));
    const datasetId = await waitForRun(data.runId, 'Scanning');
    setDiscoverStatus('Working out the outliers…', '');
    const cRes = await fetch(`/api/apify?action=creators&datasetId=${datasetId}`);
    const cData = await cRes.json();
    if (!cData.creators) throw new Error(cData.error || 'No creators returned');
    if (mine && !cData.creators.length) {
      throw new Error(`No posts found for @${handles[0]}. Check the spelling — a private or empty account returns nothing.`);
    }

    // Look at the covers before showing anything — captions can't tell a real
    // person on camera from a faceless slideshow, and that's the split that
    // decides which track a creator belongs to.
    const classified = await classifyCreators(cData.creators);
    // Someone you added by hand is yours: keep the verdict visible, but never
    // let the talking-head filter quietly drop a creator you chose deliberately.
    saveCreators(mine ? classified.map(c => ({ ...c, addedByMe: true })) : classified);
    if (mine) {
      const s = loadStarred();
      classified.forEach(c => { if (!s.includes(c.handle)) s.push(c.handle); });
      saveStarred(s);
    }
    showCreators();
  } catch (err) {
    alert((mine ? "Couldn't add that creator: " : 'Deep scan failed: ') + err.message);
    if (mine) showCreators(); else showHome();
  }
}

// Add a creator you already know about. Accepts a handle, @handle, or a URL.
async function addMyCreator() {
  const input = document.getElementById('add-creator');
  const raw = (input?.value || '').trim();
  if (!raw) return;
  const handle = (raw.match(/@?([A-Za-z0-9._]+)\s*$/) || [])[1];
  if (!handle) return alert('That does not look like a TikTok handle.');

  if (loadCreators().some(c => c.handle.toLowerCase() === handle.toLowerCase())) {
    const s = loadStarred();
    if (!s.includes(handle)) { s.push(handle); saveStarred(s); }
    input.value = '';
    return showCreators();
  }
  input.value = '';
  await deepScan([handle], { mine: true });
}

// Walks the creator list in small batches so no single request runs past
// Vercel's 60s function ceiling.
async function classifyCreators(creators) {
  const BATCH = 4;
  const byHandle = {};
  let done = 0;

  showDiscoverLoading('Watching their videos…', `0 / ${creators.length} creators`, 3);

  for (let i = 0; i < creators.length; i += BATCH) {
    const batch = creators.slice(i, i + BATCH);
    try {
      const res = await fetch('/api/apify?action=classify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          creators: batch.map(c => ({
            handle: c.handle,
            topVideos: (c.topVideos || []).map(v => ({ thumbnail: v.thumbnail }))
          })),
          frames: 3
        })
      });
      const data = await res.json();
      (data.results || []).forEach(r => { byHandle[r.handle] = r; });
    } catch (e) {
      // A failed batch just leaves those creators unclassified — the scan's
      // numbers are still worth showing.
      console.error('classify batch failed', e);
    }
    done += batch.length;
    setDiscoverStatus(null, `${Math.min(done, creators.length)} / ${creators.length} creators`);
  }

  return creators.map(c => {
    const v = byHandle[c.handle];
    return {
      ...c,
      onCamera: v?.format || 'unclear',
      production: v?.production || 'unclear',
      onCameraNote: v?.note || '',
      onCameraCount: v?.onCameraCount ?? null,
      framesSeen: v?.framesSeen ?? null
    };
  });
}

// The only creators worth copying: a real person speaking to camera, filmed
// plainly. Skits need actors, costumes, and scenes — Sarah can't do those, so
// a skit creator is off the list however well their videos perform.
// Must match OUTLIER_X in lib/discover.js. If the two drift, a creator badged
// "0 breakouts" starts feeding videos into the shortlist.
const OUTLIER_X = 3;

function isUsable(c) {
  if (c.addedByMe) return true;   // you picked them; the filter doesn't overrule you
  return c.onCamera === 'talking_head' && c.production !== 'skit';
}

// Also lets you deep scan the accounts already in Settings.
async function deepScanTracked() {
  const handles = loadAccounts().map(u => handleFromUrl(u).replace(/^@/, ''));
  if (!handles.length) { alert('No tracked accounts. Add some in ⚙️ Settings.'); return; }
  await deepScan(handles);
}

// How the on-camera verdict reads on a row.
const CAM_LABEL = {
  talking_head: 'talking head',
  faceless: 'faceless',
  mixed: 'half on camera',
  unclear: 'unknown'
};

// One bar per post, oldest to newest. Height carries the signal — a breakout is
// literally taller — so the chart still reads with the colour stripped out or in
// greyscale. The dashed rule is the OUTLIER_X line: bars crossing it are the
// breakouts, which is why the count beside it needs no explaining.
// Bars are plain divs, not SVG: they need to fill the row's width whatever the
// post count is, and SVG scaling either letterboxes them into the middle or
// distorts them. Flex handles it exactly.
//
// Linear scale from a zero baseline — height is the encoding, so it can't be
// bent. Clamped at CAP so one 40× post doesn't flatten the rest; the true best
// multiple is stated in the figures underneath.
function sparkHTML(multiples, best) {
  const m = (multiples || []).slice(-26);
  if (!m.length) return '<div class="spark-empty">no post history yet</div>';

  const CAP = 4;
  const pct = v => Math.max(6, Math.min(v / CAP, 1) * 100).toFixed(1);

  return `
    <div class="spark" role="img"
         aria-label="${m.length} recent posts, ${best} beat their average ${OUTLIER_X} times over">
      <div class="spark-rule" style="bottom:${(OUTLIER_X / CAP * 100).toFixed(0)}%"></div>
      <div class="spark-bars">
        ${m.map(v => `<span class="${v >= OUTLIER_X ? 'hit' : ''}" style="height:${pct(v)}%"></span>`).join('')}
      </div>
    </div>`;
}

function creatorRowHTML(c, rerenderFn) {
  const starred = isStarred(c.handle);
  const n = c.outlierCount || 0;
  const thumb = (c.topVideos || []).find(v => v.thumbnail)?.thumbnail;
  return `
    <div class="creator-row ${starred ? 'starred' : ''}">
      <div class="creator-main" onclick="showCreatorDetail('${c.handle}')">
        <div class="row-top">
          ${thumb ? `<img class="row-thumb" src="${thumb}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.visibility='hidden'" />` : '<div class="row-thumb"></div>'}
          <div class="row-id">
            <div class="row-handle">@${c.handle}${c.addedByMe ? '<span class="tag mine">yours</span>' : ''}</div>
            <div class="row-sub">${fmtNum(c.followers)} followers${c.addedByMe && c.onCamera !== 'talking_head' ? ` · ${CAM_LABEL[c.onCamera || 'unclear']}` : ''}${c.addedByMe && c.production === 'skit' ? ' · skits' : ''}</div>
          </div>
          <div class="row-score ${n ? '' : 'none'}">
            <span class="row-score-n">${n}</span>
            <span class="row-score-l">breakout${n === 1 ? '' : 's'}</span>
          </div>
        </div>
        ${sparkHTML(c.multiples, n)}
        <div class="row-figs">
          <span><b>${n ? c.outlierRatio + '×' : '—'}</b> best</span>
          <span><b>${fmtNum(c.medianViews)}</b> typical</span>
          <span><b>${c.reachRatio}×</b> reach</span>
        </div>
      </div>
      <button class="star-btn ${starred ? 'on' : ''}" onclick="toggleStar('${c.handle}', ${rerenderFn})">★</button>
    </div>`;
}

function showCreators() {
  const all = loadCreators();
  // Only plain talking heads. Everything else is hidden rather than deleted, so
  // the count below stays honest about what the scan actually found.
  // Same order as the API: breakout rate first. A creator who broke out four
  // times has a format that repeats; one who never has is just a healthy
  // account, and reach alone would put them on top.
  const styleRank = c => (c.style === 'tutorial' ? 0 : c.style === 'mixed' ? 1 : 2);
  const rate = c => c.outlierRate ?? (c.sampled ? (c.outlierCount || 0) / c.sampled : 0);
  const creators = all.filter(isUsable).sort((a, b) =>
       (styleRank(a) - styleRank(b))
    || (rate(b) - rate(a))
    || (b.outlierRatio - a.outlierRatio)
    || (b.reachRatio - a.reachRatio));

  const hidden = all.length - creators.length;
  const scanned = localStorage.getItem('kf_creators_date');
  const starredCount = loadStarred().length;
  document.getElementById('app').innerHTML = `
    ${headerHTML(localStorage.getItem('kf_pulled'), `${starredCount} starred`, true, 'Creators')}
    <div class="add-row" style="margin-bottom:10px;">
      <input class="add-input" id="add-creator" type="text" autocapitalize="off"
             autocorrect="off" spellcheck="false" placeholder="Add a creator you already know" />
      <button class="add-btn" onclick="addMyCreator()">Add</button>
    </div>
    ${creators.length ? `<div class="legend">
      <span><i class="sw hit"></i> beat their average ${OUTLIER_X}×</span>
      <span><i class="sw bar"></i> normal post</span>
      <span>★ to shortlist</span>
    </div>` : ''}
    <div class="creator-list">
      ${all.length === 0 ? `<div class="blank"><div class="blank-icon">🔎</div>Nothing found yet.<br>Run a search from Home, or add someone above.</div>` : ''}
      ${all.length > 0 && creators.length === 0 ? `<div class="blank"><div class="blank-icon">🚫</div>
        None of the ${all.length} creators are plain talking heads.<br>Try different keywords, or add someone above.</div>` : ''}
      ${creators.map(c => creatorRowHTML(c, 'showCreators')).join('')}
      ${hidden > 0 ? `<div class="list-foot">${hidden} hidden · faceless or skits</div>` : ''}
    </div>
    <button class="btn-secondary" onclick="showHome()" style="margin-top:0;">← Home</button>`;

  document.getElementById('add-creator')
    ?.addEventListener('keydown', e => { if (e.key === 'Enter') addMyCreator(); });
}

function showCreatorDetail(handle) {
  const c = loadCreators().find(x => x.handle === handle);
  if (!c) return showCreators();
  const starred = isStarred(handle);
  document.getElementById('app').innerHTML = `
    ${headerHTML(localStorage.getItem('kf_pulled'), null, true, '@' + c.handle)}
    <div style="flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;">
      <div style="background:var(--surface);border:0.5px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;">
        <div class="creator-handle">${c.nickname || '@' + c.handle}
          <span class="tag cam-${c.onCamera || 'unclear'}">${CAM_LABEL[c.onCamera || 'unclear']}</span>
          ${c.production === 'skit' ? '<span class="tag skit">skit</span>' : ''}
          <span class="tag ${c.style}">${c.style}</span>
        </div>
        <div class="creator-stats">
          <span class="metric">${fmtNum(c.followers)}</span> followers ·
          <span class="metric">${fmtNum(c.postCount)}</span> posts<br>
          median <span class="metric">${fmtNum(c.medianViews)}</span> views ·
          reach <span class="metric">${c.reachRatio}×</span> per follower ·
          ${Math.round(c.tutorialShare * 100)}% tutorial captions
        </div>
        ${c.onCameraNote ? `<div class="creator-stats" style="margin-top:6px;">
          <strong>On camera:</strong> ${c.onCameraNote}
          ${c.framesSeen ? ` (${c.onCameraCount}/${c.framesSeen} frames)` : ''}
        </div>` : ''}
        ${c.bio ? `<div class="creator-stats" style="margin-top:8px;">${c.bio}</div>` : ''}
        <button class="btn-secondary" onclick="toggleStar('${c.handle}', function(){showCreatorDetail('${c.handle}')})" style="margin-top:12px;">
          ${starred ? '★ Shortlisted — tap to remove' : '☆ Add to shortlist'}
        </button>
      </div>
      <div class="settings-section-title">Their biggest posts</div>
      <div style="background:var(--surface);border:0.5px solid var(--border);border-radius:14px;padding:4px 14px;">
        ${(c.topVideos || []).map(v => `
          <div class="vid-row" onclick="window.open('${v.url}','_blank')" style="cursor:pointer;">
            ${v.thumbnail ? `<img class="vid-thumb" src="${v.thumbnail}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.visibility='hidden'" />` : '<div class="vid-thumb"></div>'}
            <div class="vid-info">
              <div class="vid-caption">${(v.caption || 'No caption').replace(/</g, '&lt;')}</div>
              <div class="vid-meta">
                <span class="metric">${fmtNum(v.views)}</span> views ·
                <span class="metric">${v.multiple}×</span> their normal ·
                ${fmtNum(v.likes)} likes · ${formatPosted(v.created) || ''}
              </div>
            </div>
          </div>`).join('')}
      </div>
      <button class="btn-secondary" onclick="window.open('https://www.tiktok.com/@${c.handle}','_blank')">Open @${c.handle} on TikTok</button>
      <button class="btn-secondary" onclick="showCreators()">← Back to creators</button>
    </div>`;
}

// The shortlist: every outlier video from every starred creator, biggest
// multiple first. This is the queue of things worth recreating.
function showShortlist() {
  const starred = loadStarred();
  // isUsable guards here too: a creator starred before a re-scan reclassified
  // them as a skit shouldn't keep feeding the queue.
  const creators = loadCreators().filter(c => starred.includes(c.handle) && isUsable(c));
  const videos = [];
  creators.forEach(c => {
    (c.topVideos || []).forEach(v => {
      if (v.multiple >= OUTLIER_X) videos.push({ ...v, handle: c.handle, style: c.style });
    });
  });
  videos.sort((a, b) => b.multiple - a.multiple);

  document.getElementById('app').innerHTML = `
    ${headerHTML(localStorage.getItem('kf_pulled'), `from ${creators.length} creator${creators.length === 1 ? '' : 's'}`, true, `${videos.length} to copy`)}
    <div class="creator-list">
      ${videos.length === 0 ? `<div class="blank"><div class="blank-icon">⭐</div>
        Nothing here yet.<br>Star a creator to fill this.</div>` : ''}
      ${videos.map(v => `
        <div class="vid-card" onclick="window.open('${v.url}','_blank')">
          <div class="vid-thumb-wrap">
            ${v.thumbnail ? `<img class="vid-thumb-lg" src="${v.thumbnail}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.visibility='hidden'" />` : '<div class="vid-thumb-lg"></div>'}
            <span class="vid-mult">${v.multiple}×</span>
          </div>
          <div class="vid-body">
            <div class="vid-caption">${(v.caption || 'No caption').replace(/</g, '&lt;')}</div>
            <div class="vid-meta">@${v.handle} · <b>${fmtNum(v.views)}</b> views · ${formatPosted(v.created) || ''}</div>
          </div>
        </div>`).join('')}
    </div>
    <button class="btn-secondary" onclick="showHome()" style="margin-top:0;">← Home</button>`;
}

// ── Keywords editor (Settings) ────────────────────────────────────
function renderKeywordChips() {
  const el = document.getElementById('kw-chips');
  if (!el) return;
  const kws = loadKeywords();
  el.innerHTML = kws.length
    ? kws.map((k, i) => `<span class="kw-chip">${k}<button onclick="removeKeyword(${i})">×</button></span>`).join('')
    : `<span style="font-size:12px;color:var(--muted);">No keywords yet.</span>`;
}
function addKeyword() {
  const input = document.getElementById('kw-input');
  const raw = input.value.trim().toLowerCase();
  if (!raw) return;
  const kws = loadKeywords();
  if (!kws.includes(raw)) { kws.push(raw); saveKeywords(kws); }
  input.value = '';
  renderKeywordChips();
}
function removeKeyword(i) {
  const kws = loadKeywords(); kws.splice(i, 1); saveKeywords(kws); renderKeywordChips();
}

function swipeStageCardHTML(hasFormats, af) {
  const run = latestRun;
  const n = run?.videos?.length || 0;
  const c = run?.counts || {};
  const p = loadProgress();
  const partway = p && p.current > 0 && p.current < n;
  const meta = !run
    ? 'Nothing yet — run it from your Mac'
    : partway
      ? `${p.current} of ${n} reviewed — pick up where you left off`
      : `${c.dropped || 0} filtered out · ${runAgeLabel(run.at)}`;
  return `
      <div class="stage-card ${n ? '' : 'disabled'}" onclick="${n ? 'startStage1()' : ''}">
        <div class="stage-icon">🎬</div>
        <div class="stage-info">
          <div class="stage-title">Review videos
            ${hasFormats ? `<span class="stage-badge ready">${af.length} approved</span>` : ''}
          </div>
          <div class="stage-meta">${meta}</div>
        </div>
        ${n ? `<div class="stage-num">${partway ? n - p.current : n}<small>${partway ? 'left' : 'to review'}</small></div>` : '<div class="stage-arrow">›</div>'}
      </div>`;
}



// ── Home screen ────────────────────────────────────────────────
function showHome() {
  // Save any in-progress approvals before leaving
  if (approved.length > 0) saveApprovedFormats(approved);
  const pulled = localStorage.getItem('kf_pulled');
  const af = loadApprovedFormats();
  const afDate = localStorage.getItem('kf_approved_formats_date');

  const hasFormats = af && af.length > 0;

  // Creator discovery state
  const creators = loadCreators();
  const starred = loadStarred();
  const creatorsDate = localStorage.getItem('kf_creators_date');
  const usable = creators.filter(isUsable);
  const shortlistCount = usable
    .filter(c => starred.includes(c.handle))
    .reduce((n, c) => n + (c.topVideos || []).filter(v => v.multiple >= OUTLIER_X).length, 0);

  document.getElementById('app').innerHTML = `
    ${headerHTML(pulled, null, false, 'Katie Formats')}
    <div class="home-screen">

      <div class="stage-card ${usable.length ? '' : 'primary'}" onclick="startDiscovery()">
        <div class="stage-icon">🔎</div>
        <div class="stage-info">
          <div class="stage-title">Find creators</div>
          <div class="stage-meta">${creatorsDate ? `Last run ${shortDate(creatorsDate)}` : `${loadKeywords().length} keywords ready`}</div>
        </div>
        <div class="stage-run">Run</div>
      </div>

      <div class="stage-card ${usable.length === 0 ? 'disabled' : ''}" onclick="${usable.length ? 'showCreators()' : ''}">
        <div class="stage-icon">📈</div>
        <div class="stage-info">
          <div class="stage-title">Creators</div>
          <div class="stage-meta">${creators.length ? `${starred.length} starred of ${usable.length}` : 'Run a search first'}</div>
        </div>
        <div class="stage-num">${usable.length}<small>usable</small></div>
      </div>

      <div class="stage-card ${shortlistCount === 0 ? 'disabled' : ''}" onclick="${shortlistCount ? 'showShortlist()' : ''}">
        <div class="stage-icon">⭐</div>
        <div class="stage-info">
          <div class="stage-title">Shortlist</div>
          <div class="stage-meta">${shortlistCount ? `From ${starred.length} creator${starred.length === 1 ? '' : 's'}` : 'Star creators to fill this'}</div>
        </div>
        <div class="stage-num">${shortlistCount}<small>to copy</small></div>
      </div>

      <div style="height:1px;background:var(--border);margin:6px 0;"></div>
      ${swipeStageCardHTML(hasFormats, af)}

    </div>

    <div style="text-align:center;margin-top:24px;">
      <button onclick="resetAppData()" style="background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit;">Reset app data</button>
      <div style="color:var(--muted);font-size:11px;margin-top:8px;opacity:0.6;">${APP_VERSION}</div>
    </div>`;
}

function resetAppData() {
  if (!confirm('Clear your approvals and start this batch again? (Your tracked accounts stay.)')) return;
  ['kf_approved_formats','kf_approved_formats_date','kf_progress'].forEach(k=>localStorage.removeItem(k));
  approved.length = 0; rejected.length = 0;
  showHome();
}

function startStage1() {
  if (!latestRun?.videos?.length) return;
  formats = latestRun.videos;

  // Part-way through this same run — pick up on the next unseen card.
  const p = loadProgress();
  if (p && p.current > 0 && p.current < formats.length) {
    current = p.current;
    approved.length = 0; (p.approved || []).forEach(f => approved.push(f));
    rejected.length = 0; (p.rejected || []).forEach(f => rejected.push(f));
    showCardUI(latestRun.at, true);
    return;
  }

  const savedApproved = loadApprovedFormats();
  const finished = (p && p.current >= formats.length)
                || (!p && savedApproved && savedApproved.length > 0);
  if (finished) {
    // Finished — show the summary rather than starting again.
    approved.length = 0;
    ((p && p.approved) || savedApproved || []).forEach(f => approved.push(f));
    rejected.length = 0; ((p && p.rejected) || []).forEach(f => rejected.push(f));
    showStage1Done();
  } else {
    approved.length = 0; rejected.length = 0;
    showCardUI(latestRun.at);
  }
}



// ── Boot ───────────────────────────────────────────────────────
(function () {
  // Paint from the cached run first so the app is usable straight away, then
  // pick up anything the Mac has published since and repaint.
  latestRun = loadRunCache();
  showHome();
  fetchRun().then(() => showHome());
})();
</script>
