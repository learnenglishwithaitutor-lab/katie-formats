function togglePromptApprove(i) {
  const set = window.__promptApproved;
  if (set.has(i)) set.delete(i); else set.add(i);
  saveApprovedPromptIdx(set);
  window.__renderPromptReview();
}

// Regenerate the Norah first frame for the video that clip `i` belongs to,
// then apply the new frame URL to every clip of that same video.
async function regenerateFirstFrame(i) {
  const prepared = window.__preparedPrompts || [];
  const target = prepared[i];
  if (!target) return;
  const ref = target.refFirstFrame;
  if (!ref) { alert('No source frame available to regenerate from. Re-analyze from scratch to enable this.'); return; }
  const vIdx = target.videoIndex;
  const newOutfit = pickOutfit(target.norahOutfit); // a different outfit than current

  const btns = document.querySelectorAll(`button[onclick="regenerateFirstFrame(${i})"]`);
  btns.forEach(b => { b.disabled = true; b.textContent = 'Regenerating…'; });
  try {
    const imageUrl = await makeNorahFrame(ref, newOutfit);
    // Apply to every clip of this video
    prepared.forEach(p => { if (p.videoIndex === vIdx) { p.norahFrameUrl = imageUrl; p.norahOutfit = newOutfit; p.frameErr = null; } });
    savePreparedPrompts(prepared);
    window.__renderPromptReview();
  } catch (e) {
    const frameErr = { rejected: !!e.rejected || isPolicyReason(e.message), msg: (e.message || String(e)) };
    prepared.forEach(p => { if (p.videoIndex === vIdx) { p.norahFrameUrl = null; p.norahOutfit = newOutfit; p.frameErr = frameErr; } });
    savePreparedPrompts(prepared);
    window.__renderPromptReview();
  }
}

// Discard cached prompts/analysis and rebuild from scratch (e.g. after a prompt-logic change)
function reanalyzeFromScratch() {
  if (!confirm('Re-analyze the video and rebuild prompts from scratch? This re-runs motion analysis and costs a bit of time.')) return;
  ['kf_prepared_prompts','kf_prepared_prompts_fp','kf_prompt_approved_idx'].forEach(k => localStorage.removeItem(k));
  generateVideos();
}

// Generate only the approved prepared prompts
async function generateApprovedPrompts() {
  const prepared = window.__preparedPrompts || [];
  const approvedIdx = [...(window.__promptApproved || [])].sort((a,b)=>a-b);
  if (!approvedIdx.length) { alert('Approve at least one prompt to generate.'); return; }
  const toGen = approvedIdx.map(i => prepared[i]);

  const pulled = localStorage.getItem('kf_pulled');
  document.getElementById('app').innerHTML = `
    ${headerHTML(pulled, null, true, 'Generate videos')}
    <div class="loading-screen">
      <div class="spinner"></div>
      <div id="gen-status" style="font-weight:600;margin-top:16px;">Starting...</div>
      <div id="gen-sub" style="color:var(--muted);font-size:13px;margin-top:4px;"></div>
    </div>`;
  const setStatus = (m, sub='') => {
    const a=document.getElementById('gen-status'), b=document.getElementById('gen-sub');
    if(a)a.textContent=m; if(b)b.textContent=sub;
  };

  try {
    const results = [];
    for (let i = 0; i < toGen.length; i++) {
      const p = toGen[i];
      setStatus(`Rendering ${i+1} of ${toGen.length}...`, '@' + p.scriptObj.format.author);
      const promptPng = renderPromptToPng(p.promptText);

      // Submit to kie.ai — up to 3 attempts (original + 2 auto-retries)
      let taskId = null, submitErr = null;
      for (let attempt = 0; attempt < 3; attempt++) {
        if (attempt > 0) {
          setStatus(`Submitting ${i+1} of ${toGen.length}...`, `Retry ${attempt}/2 · @${p.scriptObj.format.author}`);
          await new Promise(r => setTimeout(r, 2000));
        } else {
          setStatus(`Submitting ${i+1} of ${toGen.length}...`, '@' + p.scriptObj.format.author);
        }
        try {
          const res = await fetch('/api/omni', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'generate', promptPng, startFrameUrl: p.norahFrameUrl || null })
          });
          const data = await res.json();
          if (!res.ok || data.error) throw new Error(`Omni (${res.status}): ${data.error || JSON.stringify(data)}`);
          taskId = data.taskId;
          submitErr = null;
          break;
        } catch (e) { submitErr = e; }
      }
      if (!taskId) {
        // All 3 attempts failed — mark this clip as failed and continue to the next
        results.push({ taskId: null, promptText: p.promptText, scriptObj: p.scriptObj, clipLabel: p.clipLabel || null, videoIndex: p.videoIndex, status: 'failed', video_url: null, failMsg: (submitErr?.message || 'Submit failed after 2 retries'), norahFrameUrl: p.norahFrameUrl || null });
        continue;
      }
      results.push({ taskId, promptText: p.promptText, scriptObj: p.scriptObj, clipLabel: p.clipLabel || null, videoIndex: p.videoIndex, status: 'processing', video_url: null, norahFrameUrl: p.norahFrameUrl || null });
    }
    generatedVideos = results;
    await pollGeneratedVideos(setStatus);
  } catch (err) {
    document.getElementById('app').innerHTML = `
      ${headerHTML(pulled, null, true, 'Generate videos')}
      <div class="loading-screen">
        <div style="font-size:40px;margin-bottom:16px;">⚠️</div>
        <div style="font-weight:600;margin-bottom:8px;">Something went wrong</div>
        <div style="color:var(--muted);font-size:13px;margin-bottom:24px;max-width:300px;text-align:center;">${err.message}</div>
        <button class="btn-secondary" onclick="showPromptReview(window.__preparedPrompts, [...(window.__promptApproved||[])])">← Back to review</button>
      </div>`;
  }
}

// Poll generatedVideos until complete. If `scopeItems` is passed, the status
// display counts only those (e.g. a single regenerated clip) instead of all.
async function pollGeneratedVideos(setStatus, scopeItems) {
  const results = generatedVideos;
  const scope = scopeItems || results;
  let attempts = 0;
  while (attempts < 60) {
    await new Promise(r => setTimeout(r, 10000));
    attempts++;
    const pending = scope.filter(r => r.status === 'processing');
    const done = scope.length - pending.length;
    setStatus(`Generating... (${attempts * 10}s elapsed)`, `${done} / ${scope.length} complete`);
    for (const item of pending) {
      try {
        const sr = await fetch(`/api/omni?action=status&taskId=${item.taskId}`);
        const sd = await sr.json();
        if (sd.status === 'success' && sd.videoUrl) {
          item.status = 'completed';
          item.video_url = sd.videoUrl;
        } else if (sd.status === 'fail') {
          item.status = 'failed';
          item.failMsg = sd.failMsg || 'Generation failed';
        }
      } catch(e) { /* keep polling */ }
    }
    if (scope.every(r => r.status !== 'processing')) break;
  }
  scope.forEach(r => { if (r.status === 'processing') r.status = 'failed'; });
  generatedVideos = results;
  saveGeneratedVideos(results);
  showStage3Done();
}

// Groups completed clips by source video and computes what a Drive send will
// actually upload (clips + stitched copy for multi-clip videos) — shared by
// the button label (accurate preview) and sendAllToDrive (the real send).
function buildDriveGroups() {
  const groupsMap = {};
  generatedVideos.forEach((v, idx) => {
    if (v.status !== 'completed' || !v.video_url) return;
    const key = (v.videoIndex !== undefined && v.videoIndex !== null) ? v.videoIndex : `solo_${idx}`;
    (groupsMap[key] = groupsMap[key] || []).push(v);
  });
  const groups = Object.values(groupsMap).map(clips => {
    clips.sort((a, b) => (a.clipLabel || '').localeCompare(b.clipLabel || ''));
    const author = clips[0]?.scriptObj?.format?.author || 'video';
    // Combine all clip prompts for this video into one text blob (with headers)
    const promptsText = clips.map((c, i) => {
      const label = c.clipLabel || `Clip ${i + 1}`;
      return `===== ${label} =====\n\n${c.promptText || '(no prompt stored)'}`;
    }).join('\n\n\n');
    return {
      author,
      promptsText,
      clips: clips.map((c, i) => ({
        url: c.video_url,
        filename: `katie_${author}_${(c.clipLabel || ('clip' + (i + 1))).replace(/\s+/g, '')}.mp4`
      }))
    };
  });
  const multiClipGroups = groups.filter(g => g.clips.length >= 2).length;
  const totalFiles = groups.reduce((n, g) => n + g.clips.length + (g.clips.length >= 2 ? 1 : 0), 0);
  return { groups, multiClipGroups, totalFiles };
}

function showStage3Done() {
  const pulled = localStorage.getItem('kf_pulled');
  const completed = generatedVideos.filter(v => v.status === 'completed');
  const failed = generatedVideos.filter(v => v.status !== 'completed');

  // Group clips by their source video (videoIndex) so we never mix unrelated videos
  const groups = {};
  generatedVideos.forEach((v, idx) => {
    const key = (v.videoIndex !== undefined && v.videoIndex !== null) ? v.videoIndex : `solo_${idx}`;
    (groups[key] = groups[key] || []).push({ ...v, _idx: idx });
  });

  const groupHTML = Object.values(groups).map(clips => {
    // completed clip URLs in clip order (Clip 1, Clip 2, ...)
    const completedClips = clips
      .filter(c => c.status === 'completed' && c.video_url)
      .sort((a,b) => (a.clipLabel||'').localeCompare(b.clipLabel||''));
    const canStitch = completedClips.length >= 2;
    const author = clips[0]?.scriptObj?.format?.author || 'unknown';

    return `
      <div style="border:0.5px solid var(--border);border-radius:14px;padding:10px;margin-bottom:14px;">
        ${clips.map(v => `
          <div class="video-result" style="margin-bottom:10px;">
            <div class="video-result-head">
              <span class="t">@${v.scriptObj?.format?.author || 'unknown'}${v.clipLabel ? ` · ${v.clipLabel}` : ''}</span>
              ${v.video_url
                ? `<a href="${v.video_url}" target="_blank" download style="font-size:11px;color:#1D9E75;font-weight:600;text-decoration:none;white-space:nowrap;">Download ↓</a>`
                : `<span style="font-size:11px;color:var(--reject);" title="${v.failMsg || ''}">Failed</span>`}
            </div>
            ${v.video_url
              ? `<video src="${v.video_url}" controls playsinline preload="metadata" style="width:100%;border-radius:12px;background:#000;margin-top:8px;max-height:70vh;"></video>`
              : `<div style="font-size:12px;color:var(--reject);margin-top:6px;">${v.failMsg || 'Generation failed'}</div>`}
            <button class="btn-secondary" onclick="regenerateOne(${v._idx})" style="margin-top:8px;font-size:13px;padding:10px;">↻ Regenerate this clip</button>
          </div>`).join('')}
        ${canStitch ? `
          <button class="btn-primary" onclick='stitchGroup(${JSON.stringify(completedClips.map(c=>c.video_url))}, "${author}")' style="margin-top:4px;font-size:14px;">
            🔗 Stitch ${completedClips.length} clips into one video →
          </button>` : ''}
      </div>`;
  }).join('');

  const driveConnected = !!localStorage.getItem('kf_google_refresh_token');
  const { multiClipGroups, totalFiles } = buildDriveGroups();

  document.getElementById('app').innerHTML = `
    ${headerHTML(pulled, null, true, 'Generate videos')}
    <div class="done" style="justify-content:flex-start;">
      <div class="check">🎬</div>
      <h2>Videos ready!</h2>
      <p>${completed.length} clip${completed.length !== 1 ? 's' : ''} generated</p>
      <div class="pills">
        <span class="pill a">${completed.length} done</span>
        ${failed.length > 0 ? `<span class="pill r">${failed.length} failed</span>` : ''}
      </div>
      <div class="video-results" style="width:100%;">
        ${groupHTML}
      </div>
      ${totalFiles > 0 ? `
      <button class="btn-primary" onclick="sendAllToDrive()" style="margin-bottom:8px;">
        ☁️ Send ${totalFiles} file${totalFiles !== 1 ? 's' : ''} to Drive${multiClipGroups ? ` (${completed.length} clip${completed.length !== 1 ? 's' : ''} + ${multiClipGroups} stitched)` : ''}${driveConnected ? '' : ' — connect'}
      </button>` : ''}
      <button class="btn-secondary" onclick="regenerateVideos()">Regenerate all</button>
      <button class="btn-secondary" onclick="showHome()">← Home</button>
    </div>`;
}

// Send every completed clip to the user's chosen Drive folder (via OAuth)
async function sendAllToDrive() {
  const completed = generatedVideos.filter(v => v.status === 'completed' && v.video_url);
  if (!completed.length) { alert('No completed videos to send.'); return; }

  let refreshToken = localStorage.getItem('kf_google_refresh_token');
  if (!refreshToken) {
    if (confirm('Connect your Google account to send videos to Drive?')) {
      window.location.href = '/api/auth';
    }
    return;
  }

  let folderId = localStorage.getItem('kf_drive_folder_id');
  if (folderId === null) {
    const input = prompt("Paste the Google Drive folder ID to upload into (the part of the folder's URL after /folders/). Leave blank to use My Drive root.");
    if (input === null) return; // cancelled
    folderId = input.trim();
    localStorage.setItem('kf_drive_folder_id', folderId);
  }

  // Group completed clips by their source video (videoIndex) — same helper
  // used for the button label, so what's sent always matches what was shown.
  const { groups, multiClipGroups, totalFiles } = buildDriveGroups();
  if (!groups.length) { alert('No completed videos to send.'); return; }

  const pulled = localStorage.getItem('kf_pulled');
  document.getElementById('app').innerHTML = `
    ${headerHTML(pulled, null, true, 'Generate videos')}
    <div class="loading-screen">
      <div class="loading-spinner"></div>
      <div class="loading-title">Sending to Drive...</div>
      <div class="loading-sub">${groups.length} video${groups.length !== 1 ? 's' : ''} · ${totalFiles} file${totalFiles !== 1 ? 's' : ''}${multiClipGroups ? ' (clips + stitched)' : ''} — this can take a minute</div>
    </div>`;

  try {
    const res = await fetch('/api/drive', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refreshToken, folderId: folderId || null, groups })
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'failed');
    const allResults = (data.groups || []).flatMap(g => g.results || []);
    const okCount = allResults.filter(r => r.ok).length;
    const failCount = allResults.length - okCount;
    alert(`Sent ${okCount} file(s) to Drive.` + (failCount ? ` ${failCount} failed — check the folder ID and try again.` : ''));
  } catch (err) {
    if (/expired|revoked|reconnect/i.test(err.message)) {
      localStorage.removeItem('kf_google_refresh_token');
      if (confirm('Google connection expired. Reconnect now?')) { window.location.href = '/api/auth'; return; }
    } else {
      alert('Send to Drive failed: ' + err.message);
    }
  }
  showStage3Done();
}

// Stitch a group's completed clips (ordered) into one MP4 via the decode service
async function stitchGroup(clipUrls, author) {
  if (!Array.isArray(clipUrls) || clipUrls.length < 2) { alert('Need at least 2 clips to stitch.'); return; }
  const pulled = localStorage.getItem('kf_pulled');
  document.getElementById('app').innerHTML = `
    ${headerHTML(pulled, null, true, 'Generate videos')}
    <div class="loading-screen">
      <div class="loading-spinner"></div>
      <div class="loading-title">Stitching ${clipUrls.length} clips...</div>
      <div class="loading-sub">@${author} — downloading, normalizing, joining</div>
    </div>`;
  try {
    const res = await fetch('/api/omni', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'stitch', clips: clipUrls })
    });
    if (!res.ok) {
      let msg = res.status;
      try { const j = await res.json(); msg = j.error || msg; } catch {}
      throw new Error(String(msg));
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    document.getElementById('app').innerHTML = `
      ${headerHTML(pulled, null, true, 'Generate videos')}
      <div class="done" style="justify-content:flex-start;">
        <div class="check">✅</div>
        <h2>Stitched video ready</h2>
        <p>@${author} · ${clipUrls.length} clips joined</p>
        <div style="width:100%;margin:12px 0;">
          <video src="${url}" controls playsinline style="width:100%;border-radius:12px;background:#000;max-height:70vh;"></video>
        </div>
        <a href="${url}" download="katie_${author}_stitched.mp4" class="btn-primary" style="text-decoration:none;display:block;text-align:center;">Download stitched video ↓</a>
        <button class="btn-secondary" onclick="sendAllToDrive()" style="margin-top:8px;">☁️ Send to Drive</button>
        <button class="btn-secondary" onclick="showStage3Done()">← Back to clips</button>
      </div>`;
  } catch (err) {
    alert('Stitch failed: ' + err.message);
    showStage3Done();
  }
}

// Regenerate a SINGLE clip by index, reusing its stored prompt
async function regenerateOne(idx) {
  const item = generatedVideos[idx];
  if (!item || !item.promptText) { alert('No stored prompt for this clip.'); return; }
  const pulled = localStorage.getItem('kf_pulled');
  document.getElementById('app').innerHTML = `
    ${headerHTML(pulled, null, true, 'Generate videos')}
    <div class="loading-screen">
      <div class="loading-spinner"></div>
      <div class="loading-title" id="gen-status">Regenerating clip...</div>
      <div class="loading-sub" id="gen-sub">@${item.scriptObj?.format?.author || ''}</div>
    </div>`;
  const setStatus = (t, s='') => {
    const a=document.getElementById('gen-status'), b=document.getElementById('gen-sub');
    if(a)a.textContent=t; if(b)b.textContent=s;
  };
  // Fetch with a couple of retries so a flaky mobile connection doesn't hard-fail
  const fetchRetry = async (url, opts, tries=3) => {
    let lastErr;
    for (let t=0; t<tries; t++) {
      try { return await fetch(url, opts); }
      catch(e) { lastErr = e; setStatus('Network hiccup — retrying…', `attempt ${t+2}/${tries}`); await new Promise(r=>setTimeout(r,1500)); }
    }
    throw lastErr;
  };
  try {
    const promptPng = renderPromptToPng(item.promptText);
    setStatus('Submitting…', '@' + (item.scriptObj?.format?.author || ''));
    const res = await fetchRetry('/api/omni', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'generate', promptPng, startFrameUrl: item.norahFrameUrl || null })
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(`Omni (${res.status}): ${data.error || 'failed'}`);
    // Reset just this item and poll ONLY this one (scope = [item]) so the
    // status shows accurate 0/1 progress, not the whole set.
    item.taskId = data.taskId; item.status = 'processing'; item.video_url = null; item.failMsg = null;
    await pollGeneratedVideos(setStatus, [item]);
  } catch (err) {
    const msg = /load failed|fetch|network/i.test(err.message)
      ? 'Network error — check your connection and try again.'
      : err.message;
    document.getElementById('app').innerHTML = `
      ${headerHTML(pulled, null, true, 'Generate videos')}
      <div class="loading-screen">
        <div style="font-size:40px;margin-bottom:16px;">⚠️</div>
        <div style="font-weight:600;margin-bottom:8px;">Regenerate failed</div>
        <div style="color:var(--muted);font-size:13px;margin-bottom:24px;max-width:300px;text-align:center;">${msg}</div>
        <button class="btn-primary" onclick="regenerateOne(${idx})">↻ Try again</button>
        <button class="btn-secondary" onclick="showStage3Done()">← Back to clips</button>
      </div>`;
  }
}

// Start an Apify run and wait for its dataset. Shared by the candidate pull

async function runApify(profiles, onTick, resultsPerPage) {
  const startRes = await fetch('/api/apify?action=start', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ profiles, resultsPerPage })
  });
  const { runId } = await startRes.json();
  if (!runId) throw new Error('Failed to start Apify run');
  for (let attempt = 1; attempt <= 90; attempt++) {
    await new Promise(r => setTimeout(r, 5000));
    if (onTick) onTick(attempt * 5);
    const statusRes = await fetch(`/api/apify?action=status&runId=${runId}`);
    const s = await statusRes.json();
    if (s.status === 'SUCCEEDED') return s.datasetId;
    if (s.status === 'FAILED' || s.status === 'ABORTED') throw new Error('Apify run failed');
  }
  throw new Error('Timed out');
}

// Every caption Sarah has posted. Cached, because it changes slowly.
async function loadSarahHistory(setLabel) {
  try {
    const cached = JSON.parse(localStorage.getItem('kf_sarah_posted') || 'null');
    const age = Date.now() - new Date(cached?.at || 0).getTime();
    if (cached?.captions?.length && age < SARAH_CACHE_DAYS * 86400000) return cached.captions;
  } catch (e) {}

  if (setLabel) setLabel('Reading what Sarah has posted...');
  // Her whole catalogue, not a recent window — a lesson she did last year is
  // still a repeat, so the six-month cut is pushed out of the way here.
  const datasetId = await runApify([SARAH_PROFILE], null, 200);
  const res = await fetch(`/api/apify?action=results&datasetId=${datasetId}&months=999`);
  const data = await res.json();
  const captions = (data.videos || []).map(v => v.title).filter(t => t && t !== 'No caption');
  localStorage.setItem('kf_sarah_posted', JSON.stringify({ at: new Date().toISOString(), captions }));
  return captions;
}

// Walk a list in chunks, a few chunks at a time. Sequentially, screening a
// two-creator pull ran to several minutes of watching a label; three at once
// brings it back to about one, and results are matched by url so arrival
// order doesn't matter.
const CHUNK_CONCURRENCY = 3;

async function postChunks(action, items, size, body, onProgress) {
  const chunks = [];
  for (let i = 0; i < items.length; i += size) chunks.push(items.slice(i, i + size));

  const out = [];
  let done = 0;
  let next = 0;

  async function worker() {
    while (next < chunks.length) {
      const chunk = chunks[next++];
      const res = await fetch(`/api/apify?action=${action}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body(chunk))
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      out.push(...(data.results || []));
      done += chunk.length;
      if (onProgress) onProgress(done, items.length);
    }
  }

  await Promise.all(
    Array.from({ length: Math.min(CHUNK_CONCURRENCY, chunks.length) }, worker)
  );
  return out;
}

// Run every candidate past the rules, then past Sarah's back catalogue.
// Returns the survivors, each carrying the verdict that let it through.
async function screenCandidates(videos, setLabel, sarahCaptions) {
  const verdicts = await postChunks(
    'screen', videos, 8, chunk => ({ videos: chunk }),
    (done, total) => setLabel && setLabel(`Screening videos... ${done}/${total}`)
  );
  const byUrl = Object.fromEntries(verdicts.map(v => [v.url, v]));

  // An unclear verdict keeps the video. The filter failing is not evidence
  // against the video, and a wrong keep is one swipe left.
  const kept = videos
    .map(v => ({ ...v, screen: byUrl[v.url] || null }))
    .filter(v => v.screen?.verdict !== 'drop');

  if (!kept.length || !sarahCaptions.length) return kept;

  const dupes = await postChunks(
    'dedupe', kept, 25,
    chunk => ({
      posted: sarahCaptions,
      candidates: chunk.map(v => ({ url: v.url, topic: v.screen?.topic || v.title }))
    }),
    (done, total) => setLabel && setLabel(`Checking against Sarah's posts... ${done}/${total}`)
  );
  const covered = Object.fromEntries(dupes.filter(d => d.covered).map(d => [d.url, d.match]));
  return kept.filter(v => !(v.url in covered));
}

// ── Refresh ────────────────────────────────────────────────────
async function triggerRefresh() {
  clearAllApproved();
  const icon = document.getElementById('refresh-icon');
  const btn = document.getElementById('refresh-btn');
  const lastLabel = document.getElementById('last-pulled');
  const accounts = loadAccounts();
  if (accounts.length === 0) { alert('No accounts to scrape. Add some in ⚙️ Settings first.'); return; }
  if (icon) icon.classList.add('spinning');
  if (btn) btn.disabled = true;
  if (lastLabel) lastLabel.textContent = 'Starting scrape...';
  const setLabel = t => { if (lastLabel) lastLabel.textContent = t; };
  try {
    // Sarah's history and the candidate pull are two independent Apify runs,
    // so they wait on each other rather than queueing.
    const [datasetId, sarahCaptions] = await Promise.all([
      runApify(accounts, secs => setLabel(`Scraping... (${secs}s)`)),
      loadSarahHistory().catch(() => [])
    ]);

    setLabel('Loading videos...');
    const resultsRes = await fetch(`/api/apify?action=results&datasetId=${datasetId}`);
    const resultsData = await resultsRes.json();
    const pulled = resultsData.videos || [];
    if (!pulled.length) { if (icon) icon.classList.remove('spinning'); if (btn) btn.disabled = false; setLabel('No videos found'); return; }

    const survivors = await screenCandidates(pulled, setLabel, sarahCaptions);
    if (!survivors.length) {
      if (icon) icon.classList.remove('spinning');
      if (btn) btn.disabled = false;
      setLabel(`Nothing new — all ${pulled.length} were filtered out`);
      return;
    }

    formats = survivors.map(v => ({
      title: v.title || 'No caption',
      views: v.views > 1000000 ? (v.views/1000000).toFixed(1)+'M' : v.views > 1000 ? Math.round(v.views/1000)+'K' : String(v.views || 0),
      comments: v.comments > 1000 ? Math.round(v.comments/1000)+'K' : String(v.comments || 0),
      url: v.url, thumbnail: v.thumbnail, author: v.author, created: v.created,
      videoFile: v.videoFile || '',
      outlierRatio: v.outlierRatio || 0,
      topic: v.screen?.topic || '',
      contentType: v.screen?.contentType || '',
      makeListicle: !!v.screen?.makeListicle
    }));
    localStorage.setItem('kf_screened_out', String(pulled.length - survivors.length));
    saveCache(formats);
    showCardUI(localStorage.getItem('kf_pulled'));
  } catch (err) {
    if (icon) icon.classList.remove('spinning');
    if (btn) btn.disabled = false;
    if (lastLabel) lastLabel.textContent = err.message.length < 40 ? err.message : 'Refresh failed — try again';
    console.error(err);
  }
}

// ── Stage 1 touch events ───────────────────────────────────────
function attachTouchEvents() {
  const card = document.getElementById('card');
  if (!card) return;
  card.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; isDragging = true; dragX = 0; }, { passive: true });
  card.addEventListener('touchmove', e => {
    if (!isDragging) return;
    dragX = e.touches[0].clientX - startX;
    const dragY = e.touches[0].clientY - startY;
    if (Math.abs(dragX) < Math.abs(dragY) && Math.abs(dragX) < 10) return;
    card.style.transform = `translateX(${dragX}px) rotate(${dragX * 0.06}deg)`;
    const progress = Math.abs(dragX) > 30 ? Math.min((Math.abs(dragX) - 30) / 70, 1) : 0;
    const sa = document.getElementById('stamp-a'); const sr = document.getElementById('stamp-r'); const ov = document.getElementById('bg-overlay');
    if (sa) sa.style.opacity = dragX > 30 ? progress : 0;
    if (sr) sr.style.opacity = dragX < -30 ? progress : 0;
    if (ov) { ov.style.background = dragX > 30 ? 'rgba(29,158,117,0.15)' : dragX < -30 ? 'rgba(226,75,74,0.15)' : 'transparent'; ov.style.opacity = progress; }
  }, { passive: true });
  card.addEventListener('touchend', () => {
    if (!isDragging) return; isDragging = false;
    if (dragX > 80) swipe('right');
    else if (dragX < -80) swipe('left');
    else { card.style.transform = ''; ['stamp-a','stamp-r','bg-overlay'].forEach(id => { const el = document.getElementById(id); if (el) el.style.opacity = 0; }); }
  });
}

// ══════════════════════════════════════════════════════════════════
//  CREATOR DISCOVERY
//
//  Finds English-teaching creators worth copying, ranked by outliers,
//  instead of reviewing one video at a time. Two phases:
//    1. Discover  — sweep keywords/hashtags for candidate handles
//    2. Deep scan — pull ~24 videos per handle for real per-creator maths
//  Phase 2 is the one that matters: you can only call a video an outlier
//  once you know what that account's normal looks like.
// ══════════════════════════════════════════════════════════════════

const DEFAULT_KEYWORDS = [
  'english tips', 'learn english', 'english grammar', 'english pronunciation',
  'speak english fluently', 'english mistakes', 'phrasal verbs', 'english vocabulary'
];

function loadKeywords() {
  try { const k = localStorage.getItem('kf_keywords'); if (k) return JSON.parse(k); } catch(e) {}
  return [...DEFAULT_KEYWORDS];
}
function saveKeywords(k) { localStorage.setItem('kf_keywords', JSON.stringify(k)); }

function loadCandidates() {
  try { const c = localStorage.getItem('kf_candidates'); if (c) return JSON.parse(c); } catch(e) {}
  return null;
}
function saveCandidates(c) {
  localStorage.setItem('kf_candidates', JSON.stringify(c));
  localStorage.setItem('kf_candidates_date', new Date().toISOString());
}

// Creators are merged across scans and kept, so a handle scanned last week
// still shows up alongside today's. Nothing is thrown away on a new sweep.
function loadCreators() {
  try { const c = localStorage.getItem('kf_creators'); if (c) return JSON.parse(c); } catch(e) {}
  return [];
}
function saveCreators(incoming) {
  const existing = loadCreators();
  const byHandle = {};
  existing.forEach(c => { byHandle[c.handle] = c; });
  incoming.forEach(c => { byHandle[c.handle] = { ...c, scannedAt: new Date().toISOString() }; });
  const merged = Object.values(byHandle);
  localStorage.setItem('kf_creators', JSON.stringify(merged));
  localStorage.setItem('kf_creators_date', new Date().toISOString());
  return merged;
}

function loadStarred() {
  try { const s = localStorage.getItem('kf_starred_creators'); if (s) return JSON.parse(s); } catch(e) {}
  return [];
}
function saveStarred(s) { localStorage.setItem('kf_starred_creators', JSON.stringify(s)); }
function isStarred(handle) { return loadStarred().includes(handle); }
function toggleStar(handle, rerender) {
  const s = loadStarred();
  const i = s.indexOf(handle);
  if (i >= 0) s.splice(i, 1); else s.push(handle);
  saveStarred(s);
  if (rerender) rerender();
}

function fmtNum(n) {
  n = Number(n) || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + 'K';
  return String(n);
}

// One long run, so the screen says which of the three stages is going and
// roughly how far in you are.
const RUN_STEPS = ['Searching', 'Checking numbers', 'Watching videos'];

function showDiscoverLoading(title, sub, step = 1) {
  document.getElementById('app').innerHTML = `
    ${headerHTML(localStorage.getItem('kf_pulled'), null, true, 'Finding creators')}
    <div class="loading-screen">
      <div class="loading-spinner"></div>
      <div>
        <div class="loading-title" id="loading-title">${title}</div>
        <div class="loading-sub" id="loading-sub">${sub || ''}</div>
      </div>
      <div class="run-steps">
        ${RUN_STEPS.map((s, i) => {
          const state = i + 1 < step ? 'step-done' : i + 1 === step ? 'step-now' : '';
          const mark = i + 1 < step ? '✓' : i + 1 === step ? '●' : i + 1;
          return `<div class="run-step ${state}"><i>${mark}</i>${s}</div>`;
        }).join('')}
      </div>
      <div class="run-note">Takes a few minutes — keep this screen open</div>
    </div>`;
}
function setDiscoverStatus(title, sub) {
  const t = document.getElementById('loading-title');
  const s = document.getElementById('loading-sub');
  if (t && title) t.textContent = title;
  if (s && sub != null) s.textContent = sub;
}

// Turns Apify's refusal into something you can act on. A spent quota and a bad
// token both surface as "couldn't start the run", and they need opposite fixes.
function apifyReason(data) {
  const msg = data.error || 'Apify would not start the run';
  if (/usage hard limit|monthly usage|limit exceeded/i.test(msg)) {
    return 'Apify has hit its monthly usage limit, so it will not start a scrape.\n\n' +
           'Open console.apify.com → Billing and either raise the spend cap or ' +
           'wait for the reset date shown there. Nothing in the app needs fixing.';
  }
  if (/token|unauthor|forbidden/i.test(msg)) {
    return 'Apify rejected the API token. Check APIFY_TOKEN in the Vercel project settings.';
  }
  return msg;
}

// Polls an Apify run until it finishes, then returns its datasetId.
async function waitForRun(runId, label) {
  for (let attempt = 1; attempt <= 90; attempt++) {
    await new Promise(r => setTimeout(r, 5000));
    const res = await fetch(`/api/apify?action=status&runId=${runId}`);
    const data = await res.json();
    const found = data.itemCount != null ? ` · ${data.itemCount} videos so far` : '';
    setDiscoverStatus(null, `${label} — ${attempt * 5}s${found}`);
    if (data.status === 'SUCCEEDED' && data.datasetId) return data.datasetId;
    if (['FAILED', 'ABORTED', 'TIMED-OUT'].includes(data.status)) {
      throw new Error('Apify run ' + data.status);
    }
  }
  throw new Error('Scrape timed out after 7.5 minutes');
}

// ── Phase 1: keyword sweep ────────────────────────────────────────
async function startDiscovery() {
  const keywords = loadKeywords();
  if (!keywords.length) { alert('Add some keywords in ⚙️ Settings first.'); return; }
  showDiscoverLoading('Searching TikTok…', `${keywords.length} keywords`, 1);
  try {
    const res = await fetch('/api/apify?action=discover', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ keywords, perKeyword: 40 })
    });
    const data = await res.json();
    if (!data.runId) throw new Error(apifyReason(data));
    const datasetId = await waitForRun(data.runId, 'Sweeping');
    setDiscoverStatus('Grouping by creator…', '');
    const cRes = await fetch(`/api/apify?action=candidates&datasetId=${datasetId}`);
    const cData = await cRes.json();
    if (!cData.candidates) throw new Error(cData.error || 'No candidates returned');
    saveCandidates(cData.candidates);

    // Straight on to the deep scan — the candidate list has nothing worth
    // deciding on, so stopping here would just be a button to press.
    const handles = pickForDeepScan(cData.candidates);
    if (!handles.length) {
      alert('The sweep found no tutorial-style creators. Try different keywords in ⚙️ Settings.');
      return showHome();
    }
    await deepScan(handles);
  } catch (err) {
    alert('Discovery failed: ' + err.message);
    showHome();
  }
}

// Who gets the expensive 24-post scan. Tutorial-style first — that's the track
// being automated — with unknowns filling the rest. Scans more than you'd
// think it needs because the talking-head filter later removes most of them.
function pickForDeepScan(candidates) {
  return [
    ...candidates.filter(c => c.style === 'tutorial'),
    ...candidates.filter(c => c.style === 'unknown')
  ].slice(0, 24).map(c => c.handle);
}

function showCandidates() {
  const candidates = loadCandidates() || [];
  const tutorial = candidates.filter(c => c.style === 'tutorial');
  document.getElementById('app').innerHTML = `
    ${headerHTML(localStorage.getItem('kf_pulled'), `${candidates.length} creators found · ${tutorial.length} look tutorial-style`, true, 'Candidates')}
    <div style="font-size:11px;color:var(--muted);padding:0 0 10px;line-height:1.5;">
      From the keyword sweep. Views here are just the one video that surfaced —
      deep scan to get each creator's real numbers.
    </div>
    <div class="creator-list">
      ${candidates.length === 0 ? `<p style="font-size:13px;color:var(--muted);text-align:center;padding:20px;">Nothing found. Try different keywords.</p>` : ''}
      ${candidates.map(c => `
        <div class="creator-row">
          <div class="creator-main" onclick="window.open('https://www.tiktok.com/@${c.handle}','_blank')">
            <div class="creator-handle">
              @${c.handle}
              <span class="tag ${c.style}">${c.style}</span>
              ${c.verified ? '<span class="tag mixed">verified</span>' : ''}
            </div>
            <div class="creator-stats">
              <span class="metric">${fmtNum(c.followers)}</span> followers ·
              best seen <span class="metric">${fmtNum(c.bestViews)}</span> views ·
              hit ${c.hits}× on your keywords
            </div>
          </div>
        </div>`).join('')}
    </div>
    <button class="btn-primary" onclick="deepScanCandidates()">Deep scan top 20 tutorial creators →</button>
    <button class="btn-secondary" onclick="showHome()">← Home</button>`;
}

// ── Phase 2: deep scan for real per-creator numbers ───────────────
async function deepScanCandidates() {
  const handles = pickForDeepScan(loadCandidates() || []);
  if (!handles.length) { alert('No tutorial-style candidates to scan.'); return; }
  await deepScan(handles);
}

async function deepScan(handles, opts = {}) {
  const mine = !!opts.mine;
  showDiscoverLoading(
    mine ? `Checking @${handles[0]}…` : 'Checking their numbers…',
    mine ? 'reading their last 24 posts' : `${handles.length} creators, ~24 posts each`, 2);
  try {
    const res = await fetch('/api/apify?action=profiles', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ handles, perProfile: 24 })
    });
    const data = await res.json();
    if (!data.runId) throw new Error(apifyReason(data));
    const datasetId = await waitForRun(data.runId, 'Scanning');
    setDiscoverStatus('Working out the outliers…', '');
    const cRes = await fetch(`/api/apify?action=creators&datasetId=${datasetId}`);
    const cData = await cRes.json();
    if (!cData.creators) throw new Error(cData.error || 'No creators returned');
    if (mine && !cData.creators.length) {
      throw new Error(`No posts found for @${handles[0]}. Check the spelling — a private or empty account returns nothing.`);
    }

    // Look at the covers before showing anything — captions can't tell a real
    // person on camera from a faceless slideshow, and that's the split that
    // decides which track a creator belongs to.
    const classified = await classifyCreators(cData.creators);
    // Someone you added by hand is yours: keep the verdict visible, but never
    // let the talking-head filter quietly drop a creator you chose deliberately.
    saveCreators(mine ? classified.map(c => ({ ...c, addedByMe: true })) : classified);
    if (mine) {
      const s = loadStarred();
      classified.forEach(c => { if (!s.includes(c.handle)) s.push(c.handle); });
      saveStarred(s);
    }
    showCreators();
  } catch (err) {
    alert((mine ? "Couldn't add that creator: " : 'Deep scan failed: ') + err.message);
    if (mine) showCreators(); else showHome();
  }
}

// Add a creator you already know about. Accepts a handle, @handle, or a URL.
async function addMyCreator() {
  const input = document.getElementById('add-creator');
  const raw = (input?.value || '').trim();
  if (!raw) return;
  const handle = (raw.match(/@?([A-Za-z0-9._]+)\s*$/) || [])[1];
  if (!handle) return alert('That does not look like a TikTok handle.');

  if (loadCreators().some(c => c.handle.toLowerCase() === handle.toLowerCase())) {
    const s = loadStarred();
    if (!s.includes(handle)) { s.push(handle); saveStarred(s); }
    input.value = '';
    return showCreators();
  }
  input.value = '';
  await deepScan([handle], { mine: true });
}

// Walks the creator list in small batches so no single request runs past
// Vercel's 60s function ceiling.
async function classifyCreators(creators) {
  const BATCH = 4;
  const byHandle = {};
  let done = 0;

  showDiscoverLoading('Watching their videos…', `0 / ${creators.length} creators`, 3);

  for (let i = 0; i < creators.length; i += BATCH) {
    const batch = creators.slice(i, i + BATCH);
    try {
      const res = await fetch('/api/apify?action=classify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          creators: batch.map(c => ({
            handle: c.handle,
            topVideos: (c.topVideos || []).map(v => ({ thumbnail: v.thumbnail }))
          })),
          frames: 3
        })
      });
      const data = await res.json();
      (data.results || []).forEach(r => { byHandle[r.handle] = r; });
    } catch (e) {
      // A failed batch just leaves those creators unclassified — the scan's
      // numbers are still worth showing.
      console.error('classify batch failed', e);
    }
    done += batch.length;
    setDiscoverStatus(null, `${Math.min(done, creators.length)} / ${creators.length} creators`);
  }

  return creators.map(c => {
    const v = byHandle[c.handle];
    return {
      ...c,
      onCamera: v?.format || 'unclear',
      production: v?.production || 'unclear',
      onCameraNote: v?.note || '',
      onCameraCount: v?.onCameraCount ?? null,
      framesSeen: v?.framesSeen ?? null
    };
  });
}

// The only creators worth copying: a real person speaking to camera, filmed
// plainly. Skits need actors, costumes, and scenes — Sarah can't do those, so
// a skit creator is off the list however well their videos perform.
// Must match OUTLIER_X in lib/discover.js. If the two drift, a creator badged
// "0 breakouts" starts feeding videos into the shortlist.
const OUTLIER_X = 3;

function isUsable(c) {
  if (c.addedByMe) return true;   // you picked them; the filter doesn't overrule you
  return c.onCamera === 'talking_head' && c.production !== 'skit';
}

// Also lets you deep scan the accounts already in Settings.
async function deepScanTracked() {
  const handles = loadAccounts().map(u => handleFromUrl(u).replace(/^@/, ''));
  if (!handles.length) { alert('No tracked accounts. Add some in ⚙️ Settings.'); return; }
  await deepScan(handles);
}

// How the on-camera verdict reads on a row.
const CAM_LABEL = {
  talking_head: 'talking head',
  faceless: 'faceless',
  mixed: 'half on camera',
  unclear: 'unknown'
};

// One bar per post, oldest to newest. Height carries the signal — a breakout is
// literally taller — so the chart still reads with the colour stripped out or in
// greyscale. The dashed rule is the OUTLIER_X line: bars crossing it are the
// breakouts, which is why the count beside it needs no explaining.
// Bars are plain divs, not SVG: they need to fill the row's width whatever the
// post count is, and SVG scaling either letterboxes them into the middle or
// distorts them. Flex handles it exactly.
//
// Linear scale from a zero baseline — height is the encoding, so it can't be
// bent. Clamped at CAP so one 40× post doesn't flatten the rest; the true best
// multiple is stated in the figures underneath.
function sparkHTML(multiples, best) {
  const m = (multiples || []).slice(-26);
  if (!m.length) return '<div class="spark-empty">no post history yet</div>';

  const CAP = 4;
  const pct = v => Math.max(6, Math.min(v / CAP, 1) * 100).toFixed(1);

  return `
    <div class="spark" role="img"
         aria-label="${m.length} recent posts, ${best} beat their average ${OUTLIER_X} times over">
      <div class="spark-rule" style="bottom:${(OUTLIER_X / CAP * 100).toFixed(0)}%"></div>
      <div class="spark-bars">
        ${m.map(v => `<span class="${v >= OUTLIER_X ? 'hit' : ''}" style="height:${pct(v)}%"></span>`).join('')}
      </div>
    </div>`;
}

function creatorRowHTML(c, rerenderFn) {
  const starred = isStarred(c.handle);
  const n = c.outlierCount || 0;
  const thumb = (c.topVideos || []).find(v => v.thumbnail)?.thumbnail;
  return `
    <div class="creator-row ${starred ? 'starred' : ''}">
      <div class="creator-main" onclick="showCreatorDetail('${c.handle}')">
        <div class="row-top">
          ${thumb ? `<img class="row-thumb" src="${thumb}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.visibility='hidden'" />` : '<div class="row-thumb"></div>'}
          <div class="row-id">
            <div class="row-handle">@${c.handle}${c.addedByMe ? '<span class="tag mine">yours</span>' : ''}</div>
            <div class="row-sub">${fmtNum(c.followers)} followers${c.addedByMe && c.onCamera !== 'talking_head' ? ` · ${CAM_LABEL[c.onCamera || 'unclear']}` : ''}${c.addedByMe && c.production === 'skit' ? ' · skits' : ''}</div>
          </div>
          <div class="row-score ${n ? '' : 'none'}">
            <span class="row-score-n">${n}</span>
            <span class="row-score-l">breakout${n === 1 ? '' : 's'}</span>
          </div>
        </div>
        ${sparkHTML(c.multiples, n)}
        <div class="row-figs">
          <span><b>${n ? c.outlierRatio + '×' : '—'}</b> best</span>
          <span><b>${fmtNum(c.medianViews)}</b> typical</span>
          <span><b>${c.reachRatio}×</b> reach</span>
        </div>
      </div>
      <button class="star-btn ${starred ? 'on' : ''}" onclick="toggleStar('${c.handle}', ${rerenderFn})">★</button>
    </div>`;
}

function showCreators() {
  const all = loadCreators();
  // Only plain talking heads. Everything else is hidden rather than deleted, so
  // the count below stays honest about what the scan actually found.
  // Same order as the API: breakout rate first. A creator who broke out four
  // times has a format that repeats; one who never has is just a healthy
  // account, and reach alone would put them on top.
  const styleRank = c => (c.style === 'tutorial' ? 0 : c.style === 'mixed' ? 1 : 2);
  const rate = c => c.outlierRate ?? (c.sampled ? (c.outlierCount || 0) / c.sampled : 0);
  const creators = all.filter(isUsable).sort((a, b) =>
       (styleRank(a) - styleRank(b))
    || (rate(b) - rate(a))
    || (b.outlierRatio - a.outlierRatio)
    || (b.reachRatio - a.reachRatio));

  const hidden = all.length - creators.length;
  const scanned = localStorage.getItem('kf_creators_date');
  const starredCount = loadStarred().length;
  document.getElementById('app').innerHTML = `
    ${headerHTML(localStorage.getItem('kf_pulled'), `${starredCount} starred`, true, 'Creators')}
    <div class="add-row" style="margin-bottom:10px;">
      <input class="add-input" id="add-creator" type="text" autocapitalize="off"
             autocorrect="off" spellcheck="false" placeholder="Add a creator you already know" />
      <button class="add-btn" onclick="addMyCreator()">Add</button>
    </div>
    ${creators.length ? `<div class="legend">
      <span><i class="sw hit"></i> beat their average ${OUTLIER_X}×</span>
      <span><i class="sw bar"></i> normal post</span>
      <span>★ to shortlist</span>
    </div>` : ''}
    <div class="creator-list">
      ${all.length === 0 ? `<div class="blank"><div class="blank-icon">🔎</div>Nothing found yet.<br>Run a search from Home, or add someone above.</div>` : ''}
      ${all.length > 0 && creators.length === 0 ? `<div class="blank"><div class="blank-icon">🚫</div>
        None of the ${all.length} creators are plain talking heads.<br>Try different keywords, or add someone above.</div>` : ''}
      ${creators.map(c => creatorRowHTML(c, 'showCreators')).join('')}
      ${hidden > 0 ? `<div class="list-foot">${hidden} hidden · faceless or skits</div>` : ''}
    </div>
    <button class="btn-secondary" onclick="showHome()" style="margin-top:0;">← Home</button>`;

  document.getElementById('add-creator')
    ?.addEventListener('keydown', e => { if (e.key === 'Enter') addMyCreator(); });
}

function showCreatorDetail(handle) {
  const c = loadCreators().find(x => x.handle === handle);
  if (!c) return showCreators();
  const starred = isStarred(handle);
  document.getElementById('app').innerHTML = `
    ${headerHTML(localStorage.getItem('kf_pulled'), null, true, '@' + c.handle)}
    <div style="flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;">
      <div style="background:var(--surface);border:0.5px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;">
        <div class="creator-handle">${c.nickname || '@' + c.handle}
          <span class="tag cam-${c.onCamera || 'unclear'}">${CAM_LABEL[c.onCamera || 'unclear']}</span>
          ${c.production === 'skit' ? '<span class="tag skit">skit</span>' : ''}
          <span class="tag ${c.style}">${c.style}</span>
        </div>
        <div class="creator-stats">
          <span class="metric">${fmtNum(c.followers)}</span> followers ·
          <span class="metric">${fmtNum(c.postCount)}</span> posts<br>
          median <span class="metric">${fmtNum(c.medianViews)}</span> views ·
          reach <span class="metric">${c.reachRatio}×</span> per follower ·
          ${Math.round(c.tutorialShare * 100)}% tutorial captions
        </div>
        ${c.onCameraNote ? `<div class="creator-stats" style="margin-top:6px;">
          <strong>On camera:</strong> ${c.onCameraNote}
          ${c.framesSeen ? ` (${c.onCameraCount}/${c.framesSeen} frames)` : ''}
        </div>` : ''}
        ${c.bio ? `<div class="creator-stats" style="margin-top:8px;">${c.bio}</div>` : ''}
        <button class="btn-secondary" onclick="toggleStar('${c.handle}', function(){showCreatorDetail('${c.handle}')})" style="margin-top:12px;">
          ${starred ? '★ Shortlisted — tap to remove' : '☆ Add to shortlist'}
        </button>
      </div>
      <div class="settings-section-title">Their biggest posts</div>
      <div style="background:var(--surface);border:0.5px solid var(--border);border-radius:14px;padding:4px 14px;">
        ${(c.topVideos || []).map(v => `
          <div class="vid-row" onclick="window.open('${v.url}','_blank')" style="cursor:pointer;">
            ${v.thumbnail ? `<img class="vid-thumb" src="${v.thumbnail}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.visibility='hidden'" />` : '<div class="vid-thumb"></div>'}
            <div class="vid-info">
              <div class="vid-caption">${(v.caption || 'No caption').replace(/</g, '&lt;')}</div>
              <div class="vid-meta">
                <span class="metric">${fmtNum(v.views)}</span> views ·
                <span class="metric">${v.multiple}×</span> their normal ·
                ${fmtNum(v.likes)} likes · ${formatPosted(v.created) || ''}
              </div>
            </div>
          </div>`).join('')}
      </div>
      <button class="btn-secondary" onclick="window.open('https://www.tiktok.com/@${c.handle}','_blank')">Open @${c.handle} on TikTok</button>
      <button class="btn-secondary" onclick="showCreators()">← Back to creators</button>
    </div>`;
}

// The shortlist: every outlier video from every starred creator, biggest
// multiple first. This is the queue of things worth recreating.
function showShortlist() {
  const starred = loadStarred();
  // isUsable guards here too: a creator starred before a re-scan reclassified
  // them as a skit shouldn't keep feeding the queue.
  const creators = loadCreators().filter(c => starred.includes(c.handle) && isUsable(c));
  const videos = [];
  creators.forEach(c => {
    (c.topVideos || []).forEach(v => {
      if (v.multiple >= OUTLIER_X) videos.push({ ...v, handle: c.handle, style: c.style });
    });
  });
  videos.sort((a, b) => b.multiple - a.multiple);

  document.getElementById('app').innerHTML = `
    ${headerHTML(localStorage.getItem('kf_pulled'), `from ${creators.length} creator${creators.length === 1 ? '' : 's'}`, true, `${videos.length} to copy`)}
    <div class="creator-list">
      ${videos.length === 0 ? `<div class="blank"><div class="blank-icon">⭐</div>
        Nothing here yet.<br>Star a creator to fill this.</div>` : ''}
      ${videos.map(v => `
        <div class="vid-card" onclick="window.open('${v.url}','_blank')">
          <div class="vid-thumb-wrap">
            ${v.thumbnail ? `<img class="vid-thumb-lg" src="${v.thumbnail}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.visibility='hidden'" />` : '<div class="vid-thumb-lg"></div>'}
            <span class="vid-mult">${v.multiple}×</span>
          </div>
          <div class="vid-body">
            <div class="vid-caption">${(v.caption || 'No caption').replace(/</g, '&lt;')}</div>
            <div class="vid-meta">@${v.handle} · <b>${fmtNum(v.views)}</b> views · ${formatPosted(v.created) || ''}</div>
          </div>
        </div>`).join('')}
    </div>
    <button class="btn-secondary" onclick="showHome()" style="margin-top:0;">← Home</button>`;
}

// ── Keywords editor (Settings) ────────────────────────────────────
function renderKeywordChips() {
  const el = document.getElementById('kw-chips');
  if (!el) return;
  const kws = loadKeywords();
  el.innerHTML = kws.length
    ? kws.map((k, i) => `<span class="kw-chip">${k}<button onclick="removeKeyword(${i})">×</button></span>`).join('')
    : `<span style="font-size:12px;color:var(--muted);">No keywords yet.</span>`;
}
function addKeyword() {
  const input = document.getElementById('kw-input');
  const raw = input.value.trim().toLowerCase();
  if (!raw) return;
  const kws = loadKeywords();
  if (!kws.includes(raw)) { kws.push(raw); saveKeywords(kws); }
  input.value = '';
  renderKeywordChips();
}
function removeKeyword(i) {
  const kws = loadKeywords(); kws.splice(i, 1); saveKeywords(kws); renderKeywordChips();
}

// ══════════════════════════════════════════════════════════════════
//  LEGACY STAGES: PAUSED
//
//  The app's job is now approving *creators*, not videos. Generation
//  happens outside the app from a locked format template + topic bank,
//  so per-video swiping and script review are both off.
//
//  No code was deleted. Flip a flag to true and that stage comes back
//  exactly as it was:
//    SWIPE_STAGE_ENABLED   swipe videos to approve formats  (Stage 1)
//    SCRIPT_STAGE_ENABLED  generate + swipe scripts         (Stage 2)
//    OMNI_STAGE_ENABLED    generate videos via kie.ai       (Stage 3)
// ══════════════════════════════════════════════════════════════════
// Back on: the app approves videos again. Creators are vetted by hand now, so
// the discovery screens below it are the parked ones — see lib/discover.js.
const SWIPE_STAGE_ENABLED  = true;
const SCRIPT_STAGE_ENABLED = false;
const OMNI_STAGE_ENABLED   = false;

const ANY_LEGACY_STAGE = SWIPE_STAGE_ENABLED || SCRIPT_STAGE_ENABLED || OMNI_STAGE_ENABLED;

function swipeStageCardHTML(hasVideos, hasFormats, af, cache, pulled) {
  return `
      <div class="stage-card ${!hasVideos ? 'disabled' : ''}" onclick="${hasVideos ? 'startStage1()' : ''}">
        <div class="stage-icon">🎬</div>
        <div class="stage-info">
          <div class="stage-title">Review formats
            ${hasFormats ? `<span class="stage-badge ready">${af.length} approved</span>` : `<span class="stage-badge empty">Not started</span>`}
          </div>
          <div class="stage-meta">${hasVideos ? `${cache.videos.length} videos from ${shortDate(pulled)}` : 'No videos yet — tap Refresh'}</div>
        </div>
        <div class="stage-arrow">›</div>
      </div>`;
}

function scriptStageCardHTML(hasFormats, hasScripts, af, as_, afDate) {
  return `
      <div class="stage-card ${!hasFormats ? 'disabled' : ''}" onclick="${hasFormats ? 'startStage2()' : ''}">
        <div class="stage-icon">✍️</div>
        <div class="stage-info">
          <div class="stage-title">Review scripts
            ${hasScripts ? `<span class="stage-badge ready">${as_.length} approved</span>` : `<span class="stage-badge empty">Not started</span>`}
          </div>
          <div class="stage-meta">${hasFormats ? `${af.length} formats approved · ${shortDate(afDate)}` : 'Complete Stage 1 first'}</div>
        </div>
        <div class="stage-arrow">›</div>
      </div>`;
}

function omniStageCardHTML(hasScripts, hasGenerated, gv, as_, asDate) {
  return `
      <div class="stage-card ${!hasScripts ? 'disabled' : ''}" onclick="${hasScripts ? 'startStage3()' : ''}">
        <div class="stage-icon">🎥</div>
        <div class="stage-info">
          <div class="stage-title">Generate videos
            ${hasGenerated ? `<span class="stage-badge ready">${gv.length} generated</span>` : `<span class="stage-badge empty">Not started</span>`}
          </div>
          <div class="stage-meta">${hasScripts ? `${as_.length} scripts approved · ${shortDate(asDate)}` : 'Complete Stage 2 first'}</div>
        </div>
        <div class="stage-arrow">›</div>
      </div>`;
}

// ── Home screen ────────────────────────────────────────────────
function showHome() {
  // Save any in-progress approvals before leaving
  if (approved.length > 0) saveApprovedFormats(approved);
  if (approvedScripts.length > 0) saveApprovedScripts(approvedScripts);
  const pulled = localStorage.getItem('kf_pulled');
  const cache = loadCache();

  const af = loadApprovedFormats();
  const as_ = loadApprovedScripts();
  const gv = loadGeneratedVideos();
  const afDate = localStorage.getItem('kf_approved_formats_date');
  const asDate = localStorage.getItem('kf_approved_scripts_date');
  const gvDate = localStorage.getItem('kf_generated_videos_date');

  const hasVideos = cache && cache.videos.length > 0;
  const hasFormats = af && af.length > 0;
  const hasScripts = as_ && as_.length > 0;
  const hasGenerated = gv && gv.length > 0;

  // Creator discovery state
  const creators = loadCreators();
  const starred = loadStarred();
  const creatorsDate = localStorage.getItem('kf_creators_date');
  const usable = creators.filter(isUsable);
  const shortlistCount = usable
    .filter(c => starred.includes(c.handle))
    .reduce((n, c) => n + (c.topVideos || []).filter(v => v.multiple >= OUTLIER_X).length, 0);

  document.getElementById('app').innerHTML = `
    ${headerHTML(pulled, null, false, ANY_LEGACY_STAGE ? 'Katie Formats' : 'Katie Formats')}
    <div class="home-screen">

      <div class="stage-card ${usable.length ? '' : 'primary'}" onclick="startDiscovery()">
        <div class="stage-icon">🔎</div>
        <div class="stage-info">
          <div class="stage-title">Find creators</div>
          <div class="stage-meta">${creatorsDate ? `Last run ${shortDate(creatorsDate)}` : `${loadKeywords().length} keywords ready`}</div>
        </div>
        <div class="stage-run">Run</div>
      </div>

      <div class="stage-card ${usable.length === 0 ? 'disabled' : ''}" onclick="${usable.length ? 'showCreators()' : ''}">
        <div class="stage-icon">📈</div>
        <div class="stage-info">
          <div class="stage-title">Creators</div>
          <div class="stage-meta">${creators.length ? `${starred.length} starred of ${usable.length}` : 'Run a search first'}</div>
        </div>
        <div class="stage-num">${usable.length}<small>usable</small></div>
      </div>

      <div class="stage-card ${shortlistCount === 0 ? 'disabled' : ''}" onclick="${shortlistCount ? 'showShortlist()' : ''}">
        <div class="stage-icon">⭐</div>
        <div class="stage-info">
          <div class="stage-title">Shortlist</div>
          <div class="stage-meta">${shortlistCount ? `From ${starred.length} creator${starred.length === 1 ? '' : 's'}` : 'Star creators to fill this'}</div>
        </div>
        <div class="stage-num">${shortlistCount}<small>to copy</small></div>
      </div>

      ${ANY_LEGACY_STAGE ? `<div style="height:1px;background:var(--border);margin:6px 0;"></div>` : ''}
      ${SWIPE_STAGE_ENABLED  ? swipeStageCardHTML(hasVideos, hasFormats, af, cache, pulled) : ''}
      ${SCRIPT_STAGE_ENABLED ? scriptStageCardHTML(hasFormats, hasScripts, af, as_, afDate) : ''}
      ${OMNI_STAGE_ENABLED   ? omniStageCardHTML(hasScripts, hasGenerated, gv, as_, asDate) : ''}

    </div>

    <div style="text-align:center;margin-top:24px;">
      <button onclick="resetAppData()" style="background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit;">Reset app data</button>
      <div style="color:var(--muted);font-size:11px;margin-top:8px;opacity:0.6;">${APP_VERSION}</div>
    </div>`;
}

function resetAppData() {
  if (!confirm('Clear all approved formats, scripts, and generated videos? (Your tracked accounts stay.) This fixes a stuck state.')) return;
  ['kf_approved_formats','kf_approved_formats_date','kf_approved_scripts','kf_approved_scripts_date','kf_generated_scripts','kf_generated_scripts_date','kf_generated_videos','kf_generated_videos_date','kf_generated_videos_fp','kf_prepared_prompts','kf_prepared_prompts_fp','kf_prompt_approved_idx'].forEach(k=>localStorage.removeItem(k));
  approved.length = 0; rejected.length = 0;
  approvedScripts.length = 0; rejectedScripts.length = 0;
  scripts = []; generatedVideos = [];
  showHome();
}

function startStage1() {
  const cache = loadCache();
  if (!cache) return;
  formats = cache.videos;
  const savedApproved = loadApprovedFormats();
  if (savedApproved && savedApproved.length > 0) {
    // Already have approvals — show summary
    approved.length = 0;
    savedApproved.forEach(f => approved.push(f));
    rejected.length = 0;
    showStage1Done();
  } else {
    // No approvals yet — go straight to swipe
    approved.length = 0; rejected.length = 0;
    showCardUI(cache.pulled);
  }
}

function startStage2() {
  const savedFormats = loadApprovedFormats();
  if (!savedFormats || savedFormats.length === 0) return;
  approved.length = 0;
  savedFormats.forEach(f => approved.push(f));
  const savedScripts = loadApprovedScripts();
  if (savedScripts && savedScripts.length > 0) {
    // Already have approved scripts — show summary
    approvedScripts.length = 0;
    savedScripts.forEach(s => approvedScripts.push(s));
    rejectedScripts.length = 0;
    showStage2Done();
  } else {
    // No approved scripts yet — go to generation/swipe
    startScriptGeneration();
  }
}

function startStage3() {
  const savedScripts = loadApprovedScripts();
  if (!savedScripts) return;
  approvedScripts.length = 0;
  savedScripts.forEach(s => approvedScripts.push(s));
  const fp = scriptsFingerprint(approvedScripts);

  // Resume 1: videos already fully generated for this exact set of approved scripts
  const cachedVideos = loadGeneratedVideos();
  if (cachedVideos && cachedVideos.length && localStorage.getItem('kf_generated_videos_fp') === fp) {
    generatedVideos = cachedVideos;
    showStage3Done();
    return;
  }

  // Resume 2: prompts already built (analyzed + written) for this exact set — skip
  // straight to review instead of re-running motion analysis + prompt generation.
  const cachedPrepared = loadPreparedPrompts();
  if (cachedPrepared && cachedPrepared.length && localStorage.getItem('kf_prepared_prompts_fp') === fp) {
    window.__preparedPrompts = cachedPrepared;
    let savedIdx = null;
    try {
      const raw = localStorage.getItem('kf_prompt_approved_idx');
      if (raw) savedIdx = JSON.parse(raw);
    } catch(e) {}
    showPromptReview(cachedPrepared, savedIdx);
    return;
  }

  // Nothing usable cached — build fresh (this is the only path that costs analysis + prompt calls)
  generateVideos();
}

// ── Boot ───────────────────────────────────────────────────────
(function () {
  const params = new URLSearchParams(window.location.search);
  if (params.get('gdrive_connected') === '1') {
    history.replaceState(null, '', window.location.pathname); // clean the URL
    const cachedVideos = loadGeneratedVideos();
    if (cachedVideos && cachedVideos.length) {
      generatedVideos = cachedVideos;
      showStage3Done();
      setTimeout(() => alert('Google connected! Tap "Send to Drive" again to continue — it\'ll ask for your folder next.'), 300);
      return;
    }
  }
  showHome();
})();
